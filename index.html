<!DOCTYPE html>
<html lang="ku" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">

<title>Python Laboratory – Lab 1-4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-anchor:none}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto 16px;direction:ltr}
.lab{padding:8px 8px;background:#16a34a;border:2px solid #15803d;border-radius:10px;color:#fff;cursor:pointer;font-size:15px;font-weight:900;font-family:inherit;letter-spacing:.4px;box-shadow:0 3px 9px rgba(0,0,0,.28);transition:all .25s}
.lab:hover{background:#22c55e;transform:translateY(-2px)}
.lab.active{background:#14532d;border-color:#fff;box-shadow:0 0 0 2px #22c55e,0 4px 12px rgba(0,0,0,.4)}
.labs-hr{border:0;height:2px;background:rgba(255,255,255,.55);border-radius:2px;max-width:360px;margin:0 auto 16px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab{padding:12px 22px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;transition:all .3s;backdrop-filter:blur(10px)}
.tab:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.tab.active{background:#fff;color:#667eea;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.tab.task:not(.active){background:#303245;border:1px solid #4f5062;color:#dfdee4;border-radius:10px;box-shadow:none}
.tab.task:not(.active):hover{background:#3a3c52}
.content{display:none}.content.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.example{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example-title{flex:1;background:linear-gradient(135deg,#e0f2fe,#bae6fd);padding:14px 18px;border-radius:8px;font-size:17px;font-weight:bold;color:#0c4a6e}
.pdf-page{background:#f97316;color:#fff;font-size:11px;font-weight:bold;padding:5px 11px;border-radius:20px;white-space:nowrap;direction:ltr;box-shadow:0 2px 6px rgba(249,115,22,.35)}
.code-box{background:#1e1e1e;border-radius:10px;margin-bottom:18px;overflow:hidden;border:1px solid #333;display:flex;direction:ltr}
.line-numbers{background:#2d2d2d;border-left:4px solid #5cb85c;padding:18px 0;min-width:42px;text-align:center;font-family:Consolas,Monaco,monospace;font-size:15px;color:#858585;line-height:1.7;user-select:none;flex-shrink:0}
.line-numbers span{display:block;padding:0 8px}
.code-content{padding:18px 20px;overflow-x:auto;flex:1}
.code-content pre{font-family:Consolas,Monaco,monospace;line-height:1.7;white-space:pre;color:#e2e8f0;font-size:15px;text-align:left}
.kw{color:#d4a574;font-weight:700}.dt{color:#bb86fc;font-weight:700}.con{color:#4fc3f7;font-weight:600}.num{color:#b5cea8}.str{color:#ce9178}.cmt{color:#6a9955;font-style:italic}
.output-box{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #3b82f6;border-radius:8px;padding:14px 18px;margin-bottom:18px;direction:ltr;overflow-x:auto}
.output-header{font-weight:bold;color:#1e40af;margin-bottom:8px;font-size:15px}
.output-content{color:#1e3a8a;font-family:Consolas,monospace;font-size:14px;line-height:1.8;white-space:pre;text-align:left}
.expl-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-right:6px solid #22c55e;border-radius:14px;padding:22px 24px}
.expl-title{font-weight:800;color:#166534;margin-bottom:14px;font-size:16px;border-bottom:2px dashed #86efac;padding-bottom:10px}
.expl-box ul{list-style:none}
.expl-box li{margin-bottom:11px;line-height:2;font-size:15px;color:#1c1917;padding:10px 14px;background:#fff;border-radius:9px;border-right:4px solid #22c55e;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rng{flex-shrink:0;min-width:36px;height:24px;line-height:22px;text-align:center;background:#dcfce7;color:#166534;font-weight:800;border:1.5px solid #22c55e;border-radius:5px;padding:0 6px;font-size:13px;margin-top:6px}.sn{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:middle}.sn.sm{font-size:10px}
.ln{background:#22c55e;color:#fff;font-weight:700;font-size:13px;padding:0 10px;border-radius:20px;height:26px;line-height:26px;flex-shrink:0;margin-top:5px;direction:ltr}
.expl-box b{color:#0369a1;background:#dbeafe;padding:1px 7px;border-radius:5px;direction:ltr;display:inline-block;font-family:Consolas,monospace;font-size:13px}
.expl-box code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.intro{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.intro h2{color:#667eea;margin-bottom:18px;font-size:1.9em}.intro p{color:#4b5563;line-height:1.8;margin-bottom:12px}
.expl-box li{flex-direction:column;align-items:flex-start;gap:6px}
.expl-box li>span:last-child{width:100%}
.expl-box .rng{min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px;margin-top:0}
.expl-box .sn{display:block;width:fit-content;max-width:100%;margin-bottom:6px;white-space:pre;text-align:left}
.expl-box .sn{overflow:visible;overflow-x:visible;white-space:normal;overflow-wrap:anywhere}
.sn.xs{font-size:8px}
.cls{color:#4ec9b0}.fn{color:#dcdcaa}.var{color:#9cdcfe}.op{color:#ff79c6}
.more-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
.more-panel{display:none;margin-top:14px;background:#f5f3ff;border:1.5px solid #c4b5fd;border-right:6px solid #7c3aed;border-radius:14px;padding:20px}
.more-panel.open{display:block;animation:fadeIn .4s}
.more-title{font-weight:800;color:#5b21b6;font-size:16px;margin-bottom:10px}
.more-intro,.more-sum{line-height:2;color:#1c1917;font-size:15px;margin-bottom:14px}
.more-panel code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.st{background:#fff;border:1.5px solid #ddd6fe;border-right:5px solid #7c3aed;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.st-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-h .rng{margin-top:0;min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px}
.st-h .sn{white-space:normal;overflow:visible;overflow-wrap:anywhere;background:#dbeafe;color:#0369a1;padding:1px 7px;border-radius:5px}
.st p{line-height:2;font-size:15px;color:#1c1917;margin-bottom:8px}
.st-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#6b7280}
.vs{font-style:normal;background:#ede9fe;color:#4c1d95;border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;direction:ltr;font-size:13px;font-weight:700}
.st p{font-size:16px;line-height:2.1}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#1fa855}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#dc2626}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
.output-box{padding:7px 12px;border-width:1.5px;border-radius:6px;margin-bottom:12px}
.output-header{font-size:12px;margin-bottom:3px}
.output-content{font-size:11px;line-height:1.5}
.st-h{flex-direction:column;align-items:flex-start;gap:6px}
.pin-fab{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
.pin-fab svg{transition:transform .2s}
.pin-wrap.full .pin-fab{border:4px solid #7c3aed}
.pin2.full .pin-fab{border-color:#dc2626}
.pin-wrap.full svg{transform:rotate(45deg)}
.usr{color:#fff;font-weight:800}
.pin-wrap.dock{left:0}
.pin-wrap.dock .pin-fab{opacity:.45;transform:translateX(-32px)}
.pin-wrap.dock .pin-pill{opacity:0;pointer-events:none}
.pin-fab{transition:transform .2s ease,background .2s,opacity .2s}
.pin-fab{touch-action:none;transition:transform .2s ease,background .2s}
.pin-fab.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin-pill{transition:background .15s,color .15s}
.pin-pill{white-space:nowrap;max-width:calc(100vw - 24px);font-size:13px;line-height:1.6;padding:8px 12px}
.pin-pill.hint{background:#7c3aed;color:#fff}.pin2 .pin-pill.hint{background:#dc2626}
.fb-box{margin-top:26px;padding:22px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;text-align:right}
.fb-title{font-weight:800;color:#5b21b6;font-size:17px;margin-bottom:6px}
.fb-sub{color:#6b5b95;font-size:13.5px;margin-bottom:14px;line-height:1.8}
.fb-quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fb-qbtn{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd6fe;background:#fff;border-radius:10px;color:#5b21b6;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.2s}
.fb-qbtn:hover{background:#ede9fe;border-color:#a78bfa}
.fb-overlay{display:none;position:fixed;inset:0;background:rgba(17,12,34,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.fb-overlay.open{display:flex}
.fb-dialog{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.fb-dialog h3{color:#5b21b6;font-size:17px;margin-bottom:14px}
.fb-dialog .fb-qbtn{width:100%;margin-bottom:10px;text-align:center}
.fb-dialog-cancel{width:100%;padding:10px;border:none;background:#f3f4f6;color:#4b5563;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.fb-area{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid #ddd6fe;border-radius:10px;font-family:inherit;font-size:14.5px;resize:vertical;color:#1c1917;box-sizing:border-box;margin-bottom:12px}
.fb-area:focus{outline:none;border-color:#7c3aed}
.fb-send{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.fb-send:hover{filter:brightness(1.07)}
.fb-send:disabled{opacity:.6;cursor:default}
.fb-send2{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.3);margin-top:10px}
.fb-msg{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;border-radius:8px;padding:9px;display:none}
.fb-msg.ok{display:block;background:#dcfce7;color:#166534}
.fb-msg.err{display:block;background:#fee2e2;color:#991b1b}
.code-box.has-tools{flex-wrap:wrap}
.code-tools{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;background:linear-gradient(180deg,#2f2f35,#26262b);border-bottom:1px solid #3b3b44;position:sticky;top:0;z-index:3;direction:ltr}
.ct-l{display:flex;align-items:center;gap:6px}
.ct-l i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5f56}
.ct-l i:nth-child(2){background:#ffbd2e}.ct-l i:nth-child(3){background:#27c93f}
.ct-l b{margin-left:8px;color:#9ca3af;font:600 12px Consolas,monospace;letter-spacing:.5px}
.ct-r{display:flex;align-items:center;gap:10px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08);color:#e5e7eb;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
.copy-btn:hover{background:rgba(255,255,255,.16)}
.copy-btn.done{background:rgba(34,197,94,.22);border-color:#4ade80;color:#86efac}
.ku-sw{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);font-weight:700;font-size:13px;color:#cbd5e1;cursor:pointer;user-select:none;direction:rtl;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,color .25s}
.ku-sw:has(input:checked){background:rgba(59,130,246,.2);border-color:#60a5fa;color:#93c5fd}
.ku-sw input{display:none}
.ku-sw .sw{position:relative;display:inline-block;width:36px;height:12px;margin:5px 4px;border-radius:6px;background:#475569;transition:background .25s;direction:ltr}
.ku-sw .sw::after{content:'';position:absolute;top:-4px;left:-3px;width:20px;height:20px;border-radius:50%;background:#94a3b8;box-shadow:0 2px 5px rgba(0,0,0,.45);transition:left .25s,background .25s,box-shadow .25s}
.ku-sw input:checked+.sw{background:#1e40af}
.ku-sw input:checked+.sw::after{left:19px;background:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.85)}
.code-box.pinned .code-tools{padding:1px 8px}.code-box.pinned .ct-l i{display:none}
@media(max-width:480px){.ct-l{display:none}.code-tools{padding:2px 6px;justify-content:center}.ct-r{flex-wrap:nowrap;justify-content:center;gap:4px;max-width:100%}.copy-btn{padding:2px 7px;font-size:11px;white-space:nowrap;gap:3px}.ku-sw{font-size:11px;gap:3px;padding:0 6px 0 1px;white-space:nowrap}.ku-sw .sw{width:22px;height:8px;margin:5px 2px;border-radius:4px}.ku-sw .sw::after{top:-4px;left:-2px;width:16px;height:16px}.ku-sw input:checked+.sw::after{left:8px}}

.req b{font-size:15px}

.chat-head{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:130;width:50px;height:50px;border:3px solid #fff;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s,background .3s}

.zoom-bar.show{display:flex}

.drawer-close{width:36px;height:36px;border:none;border-radius:10px;background:#ffffff2e;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.drawer-item{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#b91c1c;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.drawer-item+.drawer-item{margin-top:10px}
.drawer-item.asg{background:#ffffff26;color:#fff;box-shadow:inset 0 0 0 1.5px #ffffff4d}
.asg-dialog{max-width:420px;max-height:82vh;overflow-y:auto;text-align:right;direction:rtl}
.asg-dialog h3{text-align:center}
.asg-empty{color:#6b7280;font-size:14px;text-align:center;padding:18px 6px;line-height:1.9}
.asg-item{border:1.5px solid #c7d2fe;border-right:5px solid #394cb3;border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#f8faff}
.asg-item b{display:block;color:#1e293b;font-size:15px;margin-bottom:4px}
.asg-due{display:inline-block;background:#e0e7ff;color:#394cb3;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;margin-bottom:4px}
.asg-item p{color:#4b5563;font-size:13.5px;line-height:1.8;margin:0}
.asg-item a{color:#394cb3;font-weight:700;font-size:13px}
body.locked .menu-btn,body.locked .drawer,body.locked .drawer-bg{display:none}

.run-btn{background:rgba(34,197,94,.22);border-color:#4ade80;color:#86efac}
.run-btn:hover{background:rgba(34,197,94,.38)}
.run-btn.back{background:rgba(249,115,22,.22);border-color:#fb923c;color:#fdba74}
.code-tools .run-btn,.code-box.pinned .run-btn,.qb .run-btn{white-space:nowrap}
.qb{gap:6px}
.run-wait{display:none;color:#1e40af;font-family:Consolas,monospace;font-size:12px;line-height:1.5;direction:ltr;text-align:left}
.output-box.running .run-wait{display:block}
.output-box.running .output-content{visibility:hidden;height:0;overflow:hidden}
.output-box.run-glow{animation:runGlow 1.2s ease-out 1}
@keyframes runGlow{0%{box-shadow:0 0 0 0 rgba(34,197,94,0)}25%{box-shadow:0 0 0 4px rgba(34,197,94,.85),0 0 22px rgba(34,197,94,.75)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.run-view{display:none}
.code-box.showing-out .line-numbers,.code-box.showing-out .code-content{display:none}
.code-box.showing-out .run-view{display:block;flex:1 1 100%;min-width:0;padding:8px 14px 12px;border-left:4px solid #22c55e;background:#10231a;color:#bbf7d0;direction:ltr;text-align:left;overflow-x:auto}
.run-view .rv-h{font:700 12px 'Segoe UI',Tahoma,sans-serif;color:#86efac;margin-bottom:4px;direction:ltr}
.run-view .rv-b{font-family:Consolas,Monaco,monospace;font-size:13px;line-height:1.5;white-space:pre;color:#bbf7d0}
.code-box.pinned.showing-out .run-view .rv-b{font-size:12px}
.run-win{display:none;position:fixed;left:0;right:0;bottom:0;z-index:128;max-height:34vh;overflow:auto;background:#10231a;border-top:2px solid #22c55e;box-shadow:0 -6px 18px rgba(0,0,0,.5);direction:ltr}
.run-win.open{display:block}
.run-win .rw-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 14px;background:#163021;color:#86efac;font:700 12px 'Segoe UI',Tahoma,sans-serif}
.run-win .rw-x{width:28px;height:28px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.run-win .rw-b{padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));font-family:Consolas,Monaco,monospace;font-size:13px;line-height:1.5;white-space:pre;color:#bbf7d0;overflow-x:auto;text-align:left}

.qb{justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.qb::-webkit-scrollbar{display:none}
.qb>*{flex:none}.qb>:first-child{margin-left:auto}.qb>:last-child{margin-right:auto}
.code-tools .ct-r,.code-box.pinned .ct-r{min-width:0;max-width:100%;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.code-tools .ct-r::-webkit-scrollbar{display:none}
.ct-r>*{flex:none}.ct-r>:first-child{margin-left:auto}.ct-r>:last-child{margin-right:auto}
</style>

{"E": [{"t": "Your First Python Program – یەکەم بەرنامەی Python", "p": "PDF P.8", "q": "<b>داواکاری:</b> یەکەم بەرنامەی Python بنووسە: بە <code>print()</code> نووسینی <code>Hello,World!</code> لەسەر شاشە (Console) پیشان بدە و بە Run جێبەجێی بکە.", "c": "print(\"Hello,World!\")", "o": "Hello,World!"}, {"t": "Python Syntax Basics – بنەماکانی Syntax", "p": "PDF P.9", "q": "<b>داواکاری:</b> کۆمێنتێک بنووسە (بە <code>#</code> دەست پێدەکات)، گۆڕاوی <code>x = 5</code> دابنێ، و تەنها ئەگەر x لە 0 گەورەتر بوو بنووسە <code>Positive</code>. تێبینی: بلۆکی if بە 4 بۆشایی دەنووسرێت و لە کۆتایی هێڵەکان <code>;</code> نییە.", "c": "# ئەمە کۆمێنتە\nx = 5\nif x > 0:\n    print(\"Positive\")", "o": "Positive"}, {"t": "Variables & Naming Rules – گۆڕاو و ڕێساکانی ناونان", "p": "PDF P.10", "q": "<b>داواکاری:</b> زانیاری لە گۆڕاو هەڵبگرە: <code>name</code> بە نووسراوی <code>\"Ali\"</code> و <code>age</code> بە ژمارەی 20. ڕێساکان: بە پیت یان <code>_</code> دەست پێبکات، بۆشایی و نیشانەی تایبەتی نەبێت، پیتی گەورە و بچووک جیاوازن (Age ≠ age)، و ناوی ماناداری بەکاربهێنە (وەک student_count).", "c": "name = \"Ali\"\nage = 20", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "Built-in Functions: int, float, str – گۆڕینی جۆر", "p": "PDF P.12", "q": "<b>داواکاری:</b> بە فەرمانە ئامادەکراوەکان جۆری بەها بگۆڕە: <code>int(\"5\")</code> نووسراو دەکات بە ژمارەی تەواو، <code>float(\"2.5\")</code> دەکات بە ژمارەی دەهەیی، و <code>str(10)</code> ژمارە دەکات بە نووسراو. تێبینی: ئەم هێڵانە لە Console بنووسە تا ئەنجامەکەیان پیشان بدرێت؛ لە فایلێکی .py بێ <code>print()</code> هیچ پیشان نادرێت.", "c": "int(\"5\")  # ئەنجامەکەی 5 ــە\nfloat(\"2.5\")  # ئەنجامەکەی 2.5 ــە\nstr(10)  # ئەنجامەکەی نووسراوی 10 ــە", "o": "5\n2.5\n'10'"}, {"t": "Caution: int(\"hello\") → ValueError – هەڵەی ValueError", "p": "PDF P.12", "q": "<b>ئاگاداری (Caution):</b> ئەگەر نووسراوێک بکەیتە ژمارە کە ژمارە نییە، وەک <code>int(\"hello\")</code>، Python هەڵەی <code>ValueError</code> دەدات.", "c": "int(\"hello\")", "o": "ValueError: invalid literal for int() with base 10: 'hello'"}, {"t": "Input and Output: input() – وەرگرتن و چاپکردن", "p": "PDF P.13", "q": "<b>داواکاری:</b> ناوی بەکارهێنەر بپرسە بە <code>input()</code> و بیخە ناو <code>name</code>، دواتر بنووسە <code>Hello</code> لەگەڵ ناوەکە. (نموونە: بەکارهێنەر Ali دەنووسێت)", "c": "name = input(\"Enter your name: \")\nprint(\"Hello\", name)", "o": "Enter your name: Ali\nHello Ali"}, {"t": "Input and Output: Convert with int() – گۆڕینی input بۆ ژمارە", "p": "PDF P.13", "q": "<b>داواکاری:</b> هەموو input نووسراوە (str)، بۆیە دەبێت بیگۆڕیت: ژمارەیەک بپرسە، بە <code>int()</code> بیگۆڕە، و دووجای (num * num) چاپ بکە. (نموونە: 6)", "c": "num = int(input(\"Enter a number: \"))\nprint(\"Number squared:\", num * num)", "o": "Enter a number: 6\nNumber squared: 36"}, {"t": "Operators: Assignment x += 2 – ئۆپەراتۆری دانان", "p": "PDF P.14", "q": "<b>داواکاری:</b> ئۆپەراتۆرەکانی دانان (<code>=</code> و <code>+=</code> و <code>-=</code> و <code>*=</code> و <code>/=</code>) بەکاربهێنە: <code>x = 5</code> دابنێ و بە <code>x += 2</code> بەهاکەی بگۆڕە.", "c": "x = 5\nx += 2  # ئێستا بەهای x دەبێتە 7", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "Expressions & Order of Operations – ڕیزبەندی ئەنجامدان", "p": "PDF P.15", "q": "<b>داواکاری:</b> Python ڕیزبەندی PEMDAS دەگرێت: کەوانە، توان (<code>**</code>)، لێدان و دابەشکردن، کۆکردنەوە و لێکردن. <code>result = (a + b) * c</code> حیساب بکە. (سێ هێڵی یەکەم بۆ دیاریکردنی a و b و c زیاد کراون.)", "c": "a = 2\nb = 3\nc = 4\nresult = (a + b) * c", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "Code Example: Simple Calculator – ژمێرەری ساکار", "p": "PDF P.17", "q": "<b>داواکاری:</b> دوو ژمارە بپرسە، بیانگۆڕە بە float، کۆ و جیاوازی و لێکدان چاپ بکە، و دابەشکردن تەنها ئەگەر ژمارەی دووەم 0 نەبوو؛ ئەگینا بنووسە <code>Cannot divide by zero</code>. (نموونە: 10 و 4)", "c": "a = float(input(\"Enter first number: \"))\nb = float(input(\"Enter second number: \"))\n\nprint(\"Sum:\", a + b)\nprint(\"Difference:\", a - b)\nprint(\"Product:\", a * b)\n\nif b != 0:\n    print(\"Quotient:\", a / b)\nelse:\n    print(\"Cannot divide by zero\")", "o": "Enter first number: 10\nEnter second number: 4\nSum: 14.0\nDifference: 6.0\nProduct: 40.0\nQuotient: 2.5"}, {"t": "Lab 1 Task 1: Greeting and Age – سڵاو و تەمەن", "p": "PDF P.20", "q": "<b>Task 1 (فایل: <code>lab1_greeting.py</code>):</b> بەرنامەیەکی Python بنووسە کە ناو و تەمەنی بەکارهێنەر بپرسێت و سڵاوێکی تایبەت پیشان بدات. (نموونە: Ali و 20)", "c": "name = input(\"Enter your name: \")\nage = int(input(\"Enter your age: \"))\nprint(\"Hello\", name, \"you are\", age, \"years old\")", "o": "Enter your name: Ali\nEnter your age: 20\nHello Ali you are 20 years old", "tab": "Task 1"}, {"t": "Lab 1 Task 2: Simple Calculator – ژمێرەری ساکار", "p": "PDF P.21", "q": "<b>Task 2:</b> بەرنامەیەک بنووسە کە کارە بنەڕەتییەکانی ژمێریاری لەسەر دوو ژمارە بکات: دوو ژمارە بپرسە، بیانگۆڕە بە float، و کۆ و جیاوازی و لێکدان و دابەشکردن پیشان بدە. دابەشکردن بە <code>0</code> بە فەرمانی if چارەسەر بکە. (نموونە: 7 و 2)", "c": "num1 = float(input(\"Enter first number: \"))\nnum2 = float(input(\"Enter second number: \"))\n\nprint(\"Sum:\", num1 + num2)\nprint(\"Difference:\", num1 - num2)\nprint(\"Product:\", num1 * num2)\n\nif num2 != 0:\n    print(\"Quotient:\", num1 / num2)\nelse:\n    print(\"Cannot divide by zero\")", "o": "Enter first number: 7\nEnter second number: 2\nSum: 9.0\nDifference: 5.0\nProduct: 14.0\nQuotient: 3.5", "tab": "Task 2"}, {"t": "Lab 1 Task 3: Temperature Converter – گۆڕینی پلەی گەرمی", "p": "PDF P.22", "q": "<b>Task 3 (فایل: <code>lab1_converter.py</code>):</b> بەرنامەیەک بنووسە کە پلەی گەرمی لە سلیزی (Celsius) بۆ فەهرەنهایت (Fahrenheit) بگۆڕێت بە ڕێسای: F = (C × 9/5) + 32. (نموونە: 25)", "c": "celsius = float(input(\"Enter temperature in Celsius: \"))\nfahrenheit = (celsius * 9 / 5) + 32\nprint(\"Fahrenheit:\", fahrenheit)", "o": "Enter temperature in Celsius: 25\nFahrenheit: 77.0", "tab": "Task 3"}, {"t": "Lab 1 Task 4: Rectangle Area and Perimeter – ڕووبەر و دەورووبەری لاکێشە", "p": "PDF P.23", "q": "<b>Task 4 (فایل: <code>lab1_rectangle.py</code>):</b> بەرنامەیەک بنووسە کە پانی (width) و بەرزی (height) لاکێشەیەک بپرسێت، دواتر ڕووبەر و دەورووبەر حیساب بکات و پیشان بدات. ڕێسا: Area = width × height و Perimeter = 2 × (width + height). (نموونە: 5 و 3)", "c": "width = float(input(\"Enter width: \"))\nheight = float(input(\"Enter height: \"))\n\narea = width * height\nperimeter = 2 * (width + height)\n\nprint(\"Area:\", area)\nprint(\"Perimeter:\", perimeter)", "o": "Enter width: 5\nEnter height: 3\nArea: 15.0\nPerimeter: 16.0", "tab": "Task 4"}], "EX": [[["print(\"Hello,World!\")", "print وشەی <code>Hello,World!</code> چاپ دەکات."]], [["x = 5", "گۆڕاوێکمان دروست کرد بە ناوی <code>x</code> و نرخی <code>5</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["if x > 0:", "مەرجمان پێدا: ئایا <code>5</code> گەورەترە لە <code>0</code>؟ وەڵامەکەی <code>True</code> واتە بەڵێ. بۆیە بلۆکی ژێرەوە جێبەجێ دەبێت."], ["print(\"Positive\")", "print وشەی <code>Positive</code> چاپ دەکات."]], [["name = \"Ali\"", "گۆڕاوێکمان دروست کرد بە ناوی <code>name</code> و نرخی <code>\"Ali\"</code>مان پێدا، لە جۆری str واتە نووسراو."], ["age = 20", "گۆڕاوێکمان دروست کرد بە ناوی <code>age</code> و نرخی <code>20</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."]], [["int(\"5\")", "نووسراوی <code>\"5\"</code> دەکات بە ژمارەی تەواو <code>5</code> (int)."], ["float(\"2.5\")", "نووسراوی <code>\"2.5\"</code> دەکات بە ژمارەی دەهەیی <code>2.5</code> (float)."], ["str(10)", "ژمارەی <code>10</code> دەکات بە نووسراوی <code>\"10\"</code> (str)."]], [["int(\"hello\")", "هەوڵمان دا نووسراوی <code>\"hello\"</code> بکەین بە ژمارەی تەواو (int)، بەڵام hello پیتە و ژمارە نییە، بۆیە Python هەڵەی <code>ValueError</code> دەدات و بەرنامەکە دەوەستێت."]], [["name = input(\"Enter your name: \")", "پرسیارێکمان کرد بە <code>input</code>؛ بەکارهێنەر <code>\"Ali\"</code> نووسی و خرایە ناو <code>name</code>، لە جۆری str واتە نووسراو."], ["print(\"Hello\", name)", "print ئەمە چاپ دەکات: <code>Hello Ali</code>."]], [["num = int(input(\"Enter a number: \"))", "بەکارهێنەر <code>6</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>int()</code> دەیکات بە ژمارەی تەواو (int) و دەخرێتە ناو <code>num</code> (<code>6</code>)."], ["print(\"Number squared:\", num * num)", "print ئەمە چاپ دەکات: <code>Number squared: 36</code> (چونکە <code>6 * 6 = 36</code>)."]], [["x = 5", "گۆڕاوێکمان دروست کرد بە ناوی <code>x</code> و نرخی <code>5</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["x += 2", "<code>x += 2</code> واتە <code>x = x + 2</code>: <code>5 + 2 = 7</code>، بۆیە نرخی <code>x</code> بوو بە <code>7</code>."]], [["a = 2", "گۆڕاوێکمان دروست کرد بە ناوی <code>a</code> و نرخی <code>2</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["b = 3", "گۆڕاوێکمان دروست کرد بە ناوی <code>b</code> و نرخی <code>3</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["c = 4", "گۆڕاوێکمان دروست کرد بە ناوی <code>c</code> و نرخی <code>4</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["result = (a + b) * c", "حیسابمان کرد <code>(2 + 3) * 4 = 20</code>، و ئەنجامەکە خرایە ناو <code>result</code>."]], [["a = float(input(\"Enter first number: \"))", "بەکارهێنەر <code>10</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>a</code> (<code>10.0</code>)."], ["b = float(input(\"Enter second number: \"))", "بەکارهێنەر <code>4</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>b</code> (<code>4.0</code>)."], ["print(\"Sum:\", a + b)", "print ئەمە چاپ دەکات: <code>Sum: 14.0</code> (چونکە <code>10.0 + 4.0 = 14.0</code>)."], ["print(\"Difference:\", a - b)", "print ئەمە چاپ دەکات: <code>Difference: 6.0</code> (چونکە <code>10.0 - 4.0 = 6.0</code>)."], ["print(\"Product:\", a * b)", "print ئەمە چاپ دەکات: <code>Product: 40.0</code> (چونکە <code>10.0 * 4.0 = 40.0</code>)."], ["if b != 0:", "مەرجمان پێدا: ئایا < 7.0</code> (چونکە <code>2.0 * 3.5 = 7.0</code>).", []]], "sum": "پوختە: ئەنجامی ژمارەی float هەمیشە دەهەییە (وەک 7.0)."}, {"c": "f = float(input(\"Fahrenheit: \"))\nc = (f - 32) * 5 / 9\nprint(c)", "o": "Fahrenheit: 212\n100.0", "intro": "بەکارهێنەر <code>212</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>f</code> (<code>212.0</code>). دواتر حیسابمان کرد <code>(212.0 - 32) * 5 / 9 = 100.0</code>، و ئەنجامەکە خرایە ناو <code>c</code>. دواتر print ئەمە چاپ دەکات: <code>100.0</code>.", "s": [["f = float(input(\"Fahrenheit: \"))", "بەکارهێنەر <code>212</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>f</code> (<code>212.0</code>).", []], ["c = (f - 32) * 5 / 9", "حیسابمان کرد <code>(212.0 - 32) * 5 / 9 = 100.0</code>، و ئەنجامەکە خرایە ناو <code>c</code>.", []], ["print(c)", "print ئەمە چاپ دەکات: <code>100.0</code>.", []]], "sum": "پوختە: کەوانە پێش لێدان و دابەشکردن دەکرێت."}, {"c": "side = float(input(\"Side: \"))\nprint(side * side)\nprint(4 * side)", "o": "Side: 3\n9.0\n12.0", "intro": "بەکارهێنەر <code>3</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>side</code> (<code>3.0</code>). دواتر print ئەمە چاپ دەکات: <code>9.0</code> (چونکە <code>3.0 * 3.0 = 9.0</code>). دواتر print ئەمە چاپ دەکات: <code>12.0</code> (چونکە <code>4 * 3.0 = 12.0</code>).", "s": [["side = float(input(\"Side: \"))", "بەکارهێنەر <code>3</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>float()</code> دەیکات بە ژمارەی دەهەیی (float) و دەخرێتە ناو <code>side</code> (<code>3.0</code>).", []], ["print(side * side)", "print ئەمە چاپ دەکات: <code>9.0</code> (چونکە <code>3.0 * 3.0 = 9.0</code>).", []], ["print(4 * side)", "print ئەمە چاپ دەکات: <code>12.0</code> (چونکە <code>4 * 3.0 = 12.0</code>).", []]], "sum": "پوختە: ڕووبەر بە لێکدان دەدۆزرێتەوە و دەورووبەر بە کۆکردنەوەی هەموو لایەکان."}]},
{"E": [{"t": "Boolean Values – بەهای بووڵی (True / False)", "p": "PDF P.4", "q": "<b>داواکاری:</b> دوو گۆڕاو دروست بکە: <code>is_raining</code> بە <code>True</code> و <code>is_sunny</code> بە <code>False</code>. بەهای بووڵی (Boolean) تەنها دوو بەهای هەیە: True یان False.", "c": "is_raining = True\nis_sunny = False", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "Comparison Operators – ئۆپەراتۆری بەراورد", "p": "PDF P.6", "q": "<b>داواکاری:</b> <code>age = 18</code> دابنێ و بە ئۆپەراتۆری بەراورد (<code>&gt;=</code> و <code>&lt;</code>) دوو ئەنجام چاپ بکە. ئۆپەراتۆری بەراورد هەمیشە <code>True</code> یان <code>False</code> دەگەڕێنێتەوە. (ئۆپەراتۆرەکان: == != &gt; &lt; &gt;= &lt;=)", "c": "age = 18\nprint(age >= 18)  # ئەنجامەکە True ــە\nprint(age < 18)   # ئەنجامەکە False ــە", "o": "True\nFalse"}, {"t": "Logical Operators – ئۆپەراتۆری لۆجیکی", "p": "PDF P.7", "q": "<b>داواکاری:</b> <code>x = 5</code> دابنێ و بە <code>and</code> و <code>or</code> و <code>not</code> سێ ئەنجام چاپ بکە. <code>and</code>: هەردوو مەرج True بن. <code>or</code>: یەکێکیان True بێت. <code>not</code>: پێچەوانە دەکاتەوە.", "c": "x = 5\nprint(x > 0 and x < 10)  # ئەنجامەکە True ــە\nprint(x < 0 or x > 10)   # ئەنجامەکە False ــە\nprint(not (x == 5))      # ئەنجامەکە False ــە", "o": "True\nFalse\nFalse"}, {"t": "Boolean Expressions in Practice – دەربڕینی بووڵی", "p": "PDF P.8", "q": "<b>داواکاری:</b> نمرەی <code>score = 95</code> بپشکنە ئایا لە 50 گەورەتر یان یەکسانە (دەرچووە)، ئەنجامەکە بخە ناو گۆڕاوی <code>passed</code> و چاپی بکە.", "c": "score = 95\npassed = score >= 50\nprint(passed)  # ئەنجامەکە True ــە", "o": "True"}, {"t": "Introduction to if Statements – فەرمانی if", "p": "PDF P.9", "q": "<b>داواکاری:</b> گۆڕاوی <code>temperature = 35</code> دابنێ. تەنها ئەگەر لە 30 گەورەتر بوو، بنووسە <code>It's hot outside</code>. <code>if</code> بلۆکەکەی تەنها کاتێک جێبەجێ دەکات کە مەرجەکە True بێت.", "c": "temperature = 35\nif temperature > 30:\n    print(\"It's hot outside\")", "o": "It's hot outside"}, {"t": "IF-ELSE Statement – فەرمانی if-else", "p": "PDF P.10", "q": "<b>داواکاری:</b> <code>age = 15</code> دابنێ. ئەگەر 18 یان زیاتر بوو بنووسە <code>Adult</code>، ئەگینا بنووسە <code>Minor</code>. <code>else</code> دەمێنێتەوە بۆ کاتێک مەرجی if False بێت و مەرجی نییە.", "c": "age = 15\nif age >= 18:\n    print(\"Adult\")\nelse:\n    print(\"Minor\")  # ئەم هێڵە چاپ دەکرێت", "o": "Minor"}, {"t": "ELIF Example — Grade System – سیستەمی نمرە", "p": "PDF P.12", "q": "<b>داواکاری:</b> <code>score = 75</code> دابنێ و بە <code>if</code> و <code>elif</code> و <code>else</code> نمرەکە دیاری بکە: 90+ = A، 80+ = B، 70+ = C، 60+ = D، ئەگینا F. مەرجەکان بە ڕیز دەپشکنرێن و یەکەمین True جێبەجێ دەبێت.", "c": "score = 75\n\nif score >= 90:\n    print(\"Grade: A\")\nelif score >= 80:\n    print(\"Grade: B\")\nelif score >= 70:\n    print(\"Grade: C\")  # ئەم هێڵە چاپ دەکرێت\nelif score >= 60:\n    print(\"Grade: D\")\nelse:\n    print(\"Grade: F\")", "o": "Grade: C"}, {"t": "Example: Grade Classification – پۆلێنکردنی نمرە", "p": "PDF P.14", "q": "<b>داواکاری:</b> نمرەیەک (0–100) لە بەکارهێنەر بپرسە. ئەگەر لە 100 گەورەتر یان لە 0 بچووکتر بوو بنووسە <code>Invalid score.</code>، ئەگینا نمرەکە بە A و B و C و D و F دیاری بکە. (نموونە: بەکارهێنەر 105 دەنووسێت)", "c": "score = int(input(\"Enter your score (0–100): \"))\n\nif score > 100 or score < 0:\n    print(\"Invalid score.\")\nelif score >= 90:\n    print(\"Grade: A\")\nelif score >= 80:\n    print(\"Grade: B\")\nelif score >= 70:\n    print(\"Grade: C\")\nelif score >= 60:\n    print(\"Grade: D\")\nelse:\n    print(\"Grade: F\")", "o": "Enter your score (0–100): 105\nInvalid score."}, {"t": "Nested Conditions – مەرجی ناو مەرج", "p": "PDF P.15", "q": "<b>داواکاری:</b> <code>age = 18</code> و <code>has_ticket = True</code> دابنێ. یەکەم ئەگەر تەمەن 18 یان زیاتر بوو، لە ناو ئەو if دا بپشکنە ئایا بلیتی هەیە. (if ــێک لە ناو if ــێکی تر.)", "c": "age = 18\nhas_ticket = True\n\nif age >= 18:\n    if has_ticket:\n        print(\"You can enter\")  # ئەم هێڵە چاپ دەکرێت\n    else:\n        print(\"You need a ticket\")\nelse:\n    print(\"You are too young\")", "o": "You can enter"}, {"t": "Combining Conditions with and – بەستنی مەرج بە and", "p": "PDF P.17", "q": "<b>داواکاری:</b> هەمان نموونەی پێشوو بە شێوەی بێ ناو-مەرج: ئەگەر تەمەن 18 یان زیاتر <b>و</b> بلیتی هەبوو، بنووسە <code>You can enter.</code>. (دوو هێڵی یەکەم لە سڵایدی پێشووەوە هاتوون بۆ ئەوەی کۆدەکە کار بکات.)", "c": "age = 18\nhas_ticket = True\n\nif age >= 18 and has_ticket:\n    print(\"You can enter.\")", "o": "You can enter."}, {"t": "Combining Conditions with and / or – ژمارەی ئەرێنی جووت یان تاک", "p": "PDF P.18", "q": "<b>داواکاری:</b> ژمارەیەک بپرسە و بنووسە ئایا ئەرێنی جووتە (<code>Positive even number</code>)، ئەرێنی تاکە (<code>Positive odd number</code>)، سفرە (<code>Zero</code>)، یان نەرێنی (<code>Negative number</code>). (نموونە: بەکارهێنەر 7 دەنووسێت)", "c": "num = int(input(\"Enter a number: \"))\n\nif num > 0 and num % 2 == 0:\n    print(\"Positive even number\")\nelif num > 0 and num % 2 != 0:\n    print(\"Positive odd number\")\nelif num == 0:\n    print(\"Zero\")\nelse:\n    print(\"Negative number\")", "o": "Enter a number: 7\nPositive odd number"}, {"t": "Largest of Three Numbers – گەورەترین لە سێ ژمارە", "p": "PDF P.19", "q": "<b>داواکاری:</b> گەورەترین ژمارە لە سێ ژمارەی <code>a = 10</code> و <code>b = 14</code> و <code>c = 12</code> بدۆزەرەوە و بیخە ناو <code>largest</code>. بە مەرجەکان: ئەگەر a لە b و c گەورەتر یان یەکسان بوو، ئەوا a؛ ئەگینا ئەگەر b، ئەوا b؛ ئەگینا c.", "c": "a = 10\nb = 14\nc = 12\nif a >= b and a >= c:\n    largest = a\nelif b >= a and b >= c:\n    largest = b\nelse:\n    largest = c\n\nprint(\"Largest:\", largest)", "o": "Largest: 14"}, {"t": "Leap Year Code Example – ساڵی کەبیسە", "p": "PDF P.21", "q": "<b>داواکاری:</b> ساڵێک بپرسە و بنووسە ئایا ساڵی کەبیسە (Leap year) یان نا. ڕێساکان: ئەگەر بە 400 دابەش بوو، کەبیسە؛ ئەگینا ئەگەر بە 100 دابەش بوو، نا؛ ئەگینا ئەگەر بە 4 دابەش بوو، کەبیسە؛ ئەگینا نا. (نموونە: 2024)", "c": "year = int(input(\"Enter a year: \"))\n\nif year % 400 == 0:\n    print(\"Leap year\")\nelif year % 100 == 0:\n    print(\"Not a leap year\")\nelif year % 4 == 0:\n    print(\"Leap year\")\nelse:\n    print(\"Not a leap year\")", "o": "Enter a year: 2024\nLeap year"}, {"t": "Common Pitfall: Overlapping Ranges (Wrong) – مەرجی تێکەڵ (هەڵە)", "p": "PDF P.24", "q": "<b>داواکاری:</b> ئەم کۆدە بخوێنەوە: بۆ <code>score = 85</code> مەرجی یەکەم (<code>score &gt;= 60</code>) پێشتر True ــە، بۆیە مەرجی دووەم هەرگیز ناپشکنرێت و B هەرگیز نانووسرێت.", "c": "score = 85\nif score >= 60:\n    print(\"D\")\nelif score >= 80:\n    print(\"B\")", "o": "D"}, {"t": "Common Pitfall: Overlapping Ranges (Correct) – مەرجی تێکەڵ (ڕاست)", "p": "PDF P.24", "q": "<b>داواکاری:</b> وەشانی ڕاستی هەمان کۆد: مەرجی گەورەتر (<code>score &gt;= 80</code>) پێش مەرجی بچووکتر (<code>score &gt;= 60</code>) دەنووسرێت، و <code>else</code> بۆ ئەوانەی دەرناچن.", "c": "score = 85\nif score >= 80:\n    print(\"B\")\nelif score >= 60:\n    print(\"D\")\nelse:\n    print(\"Fail\")", "o": "B"}, {"t": "Task 1: Positive, Negative, or Zero – ئەرێنی، نەرێنی، یان سفر", "p": "PDF P.25", "q": "<b>Task 1 (فایل: <code>lab2_sign_checker.py</code>):</b> بەرنامەیەک بنووسە کە ژمارەیەک لە بەکارهێنەر بپرسێت (<code>Enter a number: </code>) و چاپی بکات: ئەگەر لە 0 گەورەتر بوو <code>Positive</code>، ئەگەر لە 0 بچووکتر بوو <code>Negative</code>، ئەگەر 0 بوو <code>Zero</code>. (نموونە: -4)", "c": "num = int(input(\"Enter a number: \"))\n\nif num > 0:\n    print(\"Positive\")\nelif num < 0:\n    print(\"Negative\")\nelse:\n    print(\"Zero\")", "o": "Enter a number: -4\nNegative", "tab": "Task 1"}, {"t": "Task 2: Ticket Price Based on Age – نرخی بلیت بەپێی تەمەن", "p": "PDF P.26", "q": "<b>Task 2 (فایل: <code>lab2_ticket_price.py</code>):</b> سینەما نرخی بلیت بەپێی تەمەن دیاری دەکات: لە خوار 5 ساڵ بەخۆڕایی، 5 تا 17 منداڵ (3000 IQD)، 18 تا 64 گەورە (5000 IQD)، 65 و سەرەوە بەساڵاچوو (4000 IQD). تەمەن بپرسە و نرخەکە چاپ بکە. ئەگەر نەرێنی یان لە 120 زیاتر بوو، <code>Invalid age</code> بنووسە. (نموونە: 30)", "c": "age = int(input(\"Enter your age: \"))\n\nif age < 0 or age > 120:\n    print(\"Invalid age\")\nelif age < 5:\n    print(\"Free\")\nelif age <= 17:\n    print(\"Child ticket: 3000 IQD\")\nelif age <= 64:\n    print(\"Adult ticket: 5000 IQD\")\nelse:\n    print(\"Senior ticket: 4000 IQD\")", "o": "Enter your age: 30\nAdult ticket: 5000 IQD", "tab": "Task 2"}, {"t": "Task 3: Simple Login Simulation – شبیهەسازی چوونەژوورەوە", "p": "PDF P.27", "q": "<b>Task 3 (فایل: <code>lab2_login.py</code>):</b> ناوی بەکارهێنەری دروست <code>admin</code> و وشەی نهێنی دروست <code>1234</code> ــە. ناو و وشەی نهێنی بپرسە: ئەگەر هەردووک دروست بوون <code>Login successful</code>؛ ئەگەر ناو هەڵە و وشەی نهێنی دروست <code>Wrong username</code>؛ ئەگەر ناو دروست و وشەی نهێنی هەڵە <code>Wrong password</code>؛ ئەگەر هەردووک هەڵە <code>Wrong username and password</code>. (نموونە: admin و 0000)", "c": "username = input(\"Enter username: \")\npassword = input(\"Enter password: \")\n\nif username == \"admin\" and password == \"1234\":\n    print(\"Login successful\")\nelif username != \"admin\" and password == \"1234\":\n    print(\"Wrong username\")\nelif username == \"admin\" and password != \"1234\":\n    print(\"Wrong password\")\nelse:\n    print(\"Wrong username and password\")", "o": "Enter username: admin\nEnter password: 0000\nWrong password", "tab": "Task 3"}, {"t": "Task 4: Number Range Classifier – پۆلێنکردنی ژمارە بەپێی ماوە", "p": "PDF P.28", "q": "<b>Task 4 (فایل: <code>lab2_range_classifier.py</code>):</b> ژمارەیەکی تەواو بخوێنەوە و بنووسە: <code>Small</code> ئەگەر لە نێوان 1 و 10 بوو (لەگەڵ خۆیاندا)، <code>Medium</code> ئەگەر لە نێوان 11 و 100 بوو، <code>Large</code> ئەگەر لە 100 گەورەتر بوو، و <code>Zero or negative</code> ئەگەر 0 یان کەمتر بوو. بە if و elif و else. (نموونە: 50)", "c": "num = int(input(\"Enter an integer: \"))\n\nif num <= 0:\n    print(\"Zero or negative\")\nelif num <= 10:\n    print(\"Small\")\nelif num <= 100:\n    print(\"Medium\")\nelse:\n    print(\"Large\")", "o": "Enter an integer: 50\nMedium", "tab": "Task 4"}], "EX": [[["is_raining = True", "گۆڕاوێکمان دروست کرد بە ناوی <code>is_raining</code> و نرخی <code>True</code>مان پێدا، لە جۆری bool واتە True یان False."], ["is_sunny = False", "گۆڕاوێکمان دروست کرد بە ناوی <code>is_sunny</code> و نرخی <code>False</code>مان پێدا، لە جۆری bool واتە True یان False."]], [["age = 18", "گۆڕاوێکمان دروست کرد بە ناوی <code>age</code> و نرخی <code>18</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["print(age >= 18)", "print ئەمە چاپ دەکات: <code>True</code> (چونکە <code>18 &gt;= 18 = True</code>)."], ["print(age < 18)", "print ئەمە چاپ دەکات: <code>False</code> (چونکە <code>18 &lt; 18 = False</code>)."]], [["x = 5", "گۆڕاوێکمان دروست کرد بە ناوی <code>x</code> و نرخی <code>5</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["print(x > 0 and x < 10)", "print ئەمە چاپ دەکات: <code>True</code> (چونکە <code>5 &gt; 0 and 5 &lt; 10 = True</code>)."], ["print(x < 0 or x > 10)", "print ئەمە چاپ دەکات: <code>False</code> (چونکە <code>5 &lt; 0 or 5 &gt; 10 = False</code>)."], ["print(not (x == 5))", "print ئەمە چاپ دەکات: <code>False</code> (چونکە <code>not 5 == 5 = False</code>)."]], [["score = 95", "گۆڕاوێکمان دروست کرد بە ناوی <code>score</code> و نرخی <code>95</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["passed = score >= 50", "ئایا <code>95</code> گەورەترە یان یەکسانە بە <code>50</code>؟ وەڵامەکەی <code>True</code> واتە بەڵێ، و خرایە ناو <code>passed</code> (bool)."], ["print(passed)", "print ئەمە چاپ دەکات: <code>True</code>."]], [["temperature = 35", "گۆڕاوێکمان دروست کرد بە ناوی <code>temperature</code> و نرخی <code>35</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["if temperature > 30:", "مەرجمان پێدا: ئایا <code>35</code> گەورەترە لە <code>30</code>؟ وەڵامەکەی <code>True</code> واتە بەڵێ. بۆیە بلۆکی ژێرەوە جێبەجێ دەبێت."], ["print(\"It's hot outside\")", "print نووسراوی <code>It's hot outside</code> چاپ دەکات."]], [["age = 15", "گۆڕاوێکمان دروست کرد بە ناوی <code>age</code> و نرخی <code>15</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["if age >= 18:", "مەرجمان پێدا: ئایا <code>15</code> گەورەترە یان یەکسانە بە <code>18</code>؟ وەڵامەکەی <code>False</code> واتە نەخێر. بۆیە بلۆکی ژێرەوە جێبەجێ نابێت."], ["print(\"Adult\")", "ئەم هێڵە جێبەجێ نابێت، چونکە مەرجەکەی True نەبوو."], ["else:", "هیچ مەرجێکی سەرەوە True نەبوو، بۆیە else جێبەجێ دەبێت."], ["print(\"Minor\")", "print وشەی <code>Minor</code> چاپ دەکات."]], [["score = 75", "گۆڕاوێکمان دروست کرد بە ناوی <code>score</code> و نرخی <code>75</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["if score >= 90:", "مەرجمان پێدا: ئایا <code>75</code> گەورەترە یان یەکسانە بە <code>90</code>؟ وەڵامەکەی <code>False</code> واتە نەخێر. بۆیە بلۆکی ژێرەوە جێبەجێ نابێت."], ["print(\"Grade: A\")", "ئەم هێڵە جێبەجێ نابێت، چونکە مەرجەکەی True نەبوو."], ["elif score >= 80:", "مەرجمان پێدا: ئایا <code>75</code> گەورەترە یان یەکسانە بە <code>80</code>؟ وەڵامەکەی <code>False</code> واتە نەخێر. بۆیە بلۆکی ژێرەوە جێبەجێ نابێت."], ["print(\"Grade: B\")", "ئەم هێڵە جێبەجێ نابێت، چونکە مەرجەکەی True نەبوو."], ["elif score >= 70:", "مەرجمان پێدا: ئایا <code>75</code> گەورەترە یان یەکسانە بە <code>70</code>؟ وەڵامەکەی <code>True</code> واتە بەڵێ. بۆیە بلۆکی ژێرەوە جێبەجێ دەبێت."], ["print(\"Grade: C\")", "print نووسراوی <code>Grade: C</code> چاپ دەکات."], ["elif score >= 60:", "ئەم مەرجە ناپشکنرێت، چونکە مەرجێکی سەرەوە پێشتر True بوو."], ["print(\"Grade: D\")", "ئەم هێڵە جێبەجێ نابێت، چونکە مەرجەکەی True نەبوو."], ["else:", "مەرجێکی سەرەوە True بوو، بۆیە else جێبەجێ نابێت."], ["print(\"Grade: F\")", "ئەم هێڵە جێبەجێ نابێت، چونکە مەرجەکەی True نەبوو."]], [["score = int(input(\"Enter your score (0–100): \"))", "بەکارهێنەر <code>105</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>int()</code> دەیکات بە ژمارەی تەواو (int) و دەخرێتە ناو <code>score</code> (<code>105</code>)."], ["if score > 1 {"E": [{"t": "The for Loop – لووپی for", "p": "PDF P.6", "q": "<b>داواکاری:</b> لیستی <code>[1, 2, 3]</code> بەکاربهێنە و بە <code>for</code> هەر توخمێکی بخەرە ناو <code>i</code> و چاپی بکە. لووپەکە هەر توخمێک وەردەگرێت، دەیداتە <code>i</code>، و بلۆکەکە بۆ هەر توخمێک یەک جار جێبەجێ دەکات.", "c": "for i in [1, 2, 3]:\n    print(i)", "o": "1\n2\n3"}, {"t": "for Loop with range() – لووپی for لەگەڵ range()", "p": "PDF P.7", "q": "<b>داواکاری:</b> <code>range()</code> زنجیرەیەک ژمارە دروست دەکات. بە <code>range(4)</code> ژمارەکان لە 0 تا stop-1 بەرهەم بهێنە و بە <code>for</code> هەموویان چاپ بکە.", "c": "for i in range(4):\n    print(i)", "o": "0\n1\n2\n3"}, {"t": "range(2, 6) – range بە start و stop", "p": "PDF P.8", "q": "<b>داواکاری:</b> ئەمجارە <code>range(2, 6)</code> بەکاربهێنە: دەستپێک (start) ــە 2 و کۆتایی (stop) ــە 6. ژمارەکان بە <code>for</code> چاپ بکە. تێبینی: start دەخرێتە ناو ژمارەکانەوە، بەڵام stop نایخرێتە ناوی.", "c": "for i in range(2, 6):\n    print(i)", "o": "2\n3\n4\n5"}, {"t": "range(0, 10, 2) – range بە step", "p": "PDF P.8", "q": "<b>داواکاری:</b> <code>range(0, 10, 2)</code> بەکاربهێنە: start = 0، stop = 10، و step = 2 (هەر جارێک 2 زیاد بکات). ژمارەکان چاپ بکە.", "c": "for i in range(0, 10, 2):\n    print(i)", "o": "0\n2\n4\n6\n8"}, {"t": "Practical Example: Sum of 1 to 10 – کۆی 1 تا 10", "p": "PDF P.9", "q": "<b>داواکاری:</b> کۆی ژمارەکانی 1 تا 10 بدۆزەرەوە. بە <code>total = 0</code> دەست پێبکە و لە هەر خولێکدا <code>i</code> بخە سەر <code>total</code>، دواتر کۆی کۆتایی چاپ بکە. (PDF: i = 1 → total = 1، i = 2 → total = 3 ... i = 10 → total = 55)", "c": "total = 0\nfor i in range(1, 11):\n    total = total + i\n\nprint(\"Sum:\", total)", "o": "Sum: 55"}, {"t": "The while Loop Concept – لووپی while", "p": "PDF P.10", "q": "<b>داواکاری:</b> <code>while</code> هەتا مەرجێک True بێت دووبارە دەبێتەوە. گۆڕاوی <code>count</code> لە 1 دەست پێبکە و تا 5 چاپی بکە، و لە هەر خولێکدا یەک زیادی بکە.", "c": "count = 1\nwhile count <= 5:\n    print(count)\n    count += 1", "o": "1\n2\n3\n4\n5"}, {"t": "Example: Input Until Valid – داخڵکردن هەتا دروست بێت", "p": "PDF P.12", "q": "<b>داواکاری:</b> تەمەن لە بەکارهێنەر بپرسە. هەتا تەمەنەکە لە دەرەوەی 0 تا 120 بێت، پەیامی هەڵە پیشان بدە و دووبارە بپرسە. (لە دەرەنجامدا نموونەی نووسینی 150 و دواتر 25 هاتووە.)", "c": "age = int(input(\"Enter your age (0-120): \"))\n\nwhile age < 0 or age > 120:\n    print(\"Invalid age. Try again.\")\n    age = int(input(\"Enter your age (0-120): \"))\n\nprint(\"Your age is:\", age)", "o": "Enter your age (0-120): 150\nInvalid age. Try again.\nEnter your age (0-120): 25\nYour age is: 25"}, {"t": "Infinite Loops – لووپی بێ کۆتایی", "p": "PDF P.13", "q": "<b>داواکاری:</b> ئەم کۆدە بۆچی دەبێتە لووپی بێ کۆتایی (infinite loop)؟ گۆڕاوی <code>x</code> لە 1 دەست پێدەکات، بەڵام هەڵەکە ئەوەیە <code>x += 1</code> نەنووسراوە.", "c": "x = 1\nwhile x <= 5:\n    print(x)\n    # x += 1 نەنووسراوە", "o": "1\n1\n1\n1\n... (هەرگیز ناوەستێت؛ بۆ ڕاگرتن Ctrl+C بکە)"}, {"t": "The break Statement – فەرمانی break", "p": "PDF P.14", "q": "<b>داواکاری:</b> لە <code>range(10)</code> ژمارەکان چاپ بکە، بەڵام کاتێک <code>i</code> دەگاتە 5، <code>Found 5!</code> بنووسە و بە <code>break</code> لە لووپەکە دەربچۆ. لە کۆتاییدا <code>Done</code> چاپ بکە.", "c": "for i in range(10):\n    if i == 5:\n        print(\"Found 5!\")\n        break  # لە لووپەکە دەرچۆ\n    print(i)\n\nprint(\"Done\")", "o": "0\n1\n2\n3\n4\nFound 5!\nDone"}, {"t": "break in while Loop – break لە لووپی while", "p": "PDF P.15", "q": "<b>داواکاری:</b> بە <code>while True</code> دووبارە وشەیەک بپرسە و چاپی بکە. کاتێک بەکارهێنەر <code>quit</code> دەنووسێت بە <code>break</code> لووپەکە بوەستێنە و <code>Goodbye!</code> بنووسە. (نموونەی نووسین: hello، python، quit)", "c": "while True:\n    text = input(\"Enter word (or 'quit'): \")\n    if text == \"quit\":\n        break\n    print(\"You typed:\", text)\n\nprint(\"Goodbye!\")", "o": "Enter word (or 'quit'): hello\nYou typed: hello\nEnter word (or 'quit'): python\nYou typed: python\nEnter word (or 'quit'): quit\nGoodbye!"}, {"t": "The continue Statement – فەرمانی continue", "p": "PDF P.16", "q": "<b>داواکاری:</b> لە <code>range(1, 6)</code> تەنها ژمارە تاکەکان چاپ بکە. ئەگەر <code>i</code> جووت بوو، بە <code>continue</code> بڕۆ بۆ خولی دواتر.", "c": "for i in range(1, 6):\n    if i % 2 == 0:\n        continue  # ئەگەر جووت بوو، بچۆ بۆ خولی دواتر\n    print(i)", "o": "1\n3\n5"}, {"t": "Nested Loops – لووپی ناو لووپ", "p": "PDF P.18", "q": "<b>داواکاری:</b> دوو <code>for</code> لە ناو یەک بنووسە. لووپی ناوەوە بۆ هەر خولێکی لووپی دەرەوە بە تەواوی دووبارە دەبێتەوە. هەر جارێک بەهای <code>i</code> و <code>j</code> چاپ بکە.", "c": "for i in range(1, 4):\n    for j in range(1, 4):\n        print(\"i =\", i, \", j =\", j)", "o": "i = 1 , j = 1\ni = 1 , j = 2\ni = 1 , j = 3\ni = 2 , j = 1\ni = 2 , j = 2\ni = 2 , j = 3\ni = 3 , j = 1\ni = 3 , j = 2\ni = 3 , j = 3"}, {"t": "Nested Loops — Multiplication Table – خشتەی لێکدان", "p": "PDF P.19", "q": "<b>داواکاری:</b> بە دوو لووپ خشتەی لێکدان چاپ بکە. لووپی دەرەوە هەر ڕیزێک (i) و لووپی ناوەوە هەر ستوونێک (j) دەگرێت. تێبینی: لە سڵایدەکە نووسراوە 3×3، بەڵام کۆدەکە <code>range(1, 6)</code> بەکاردێنێت، بۆیە خشتەکە 5×5 دەبێت.", "c": "for i in range(1, 6):\n    for j in range(1, 6):\n        print(i * j, end=\"\\t\")\n    print()  # دەچێتە هێڵی دواتر", "o": "1\t2\t3\t4\t5\t\n2\t4\t6\t8\t10\t\n3\t6\t9\t12\t15\t\n4\t8\t12\t16\t20\t\n5\t10\t15\t20\t25\t"}, {"t": "Loop Tracing Example (for) – شوێنکەوتنی لووپ", "p": "PDF P.20", "q": "<b>داواکاری:</b> ئەم کۆدە بخوێنەوە و وەڵامی ئەم دوو پرسیارە بدەرەوە: ١- <code>print(\"Outer:\", i)</code> چەند جار جێبەجێ دەبێت؟ ٢- <code>print(\"  Inner:\", j)</code> چەند جار جێبەجێ دەبێت؟ (وەڵام: 3 جار و 6 جار)", "c": "for i in range(1, 4):\n    print(\"Outer:\", i)\n    for j in range(1, 3):\n        print(\"  Inner:\", j)", "o": "Outer: 1\n  Inner: 1\n  Inner: 2\nOuter: 2\n  Inner: 1\n  Inner: 2\nOuter: 3\n  Inner: 1\n  Inner: 2"}, {"t": "Loop Tracing Example (while) – شوێنکەوتنی while", "p": "PDF P.21", "q": "<b>داواکاری:</b> ئەم کۆدە چی دەنووسێت؟ <code>n</code> لە 5 دەست پێدەکات و لە هەر خولێکدا یەک کەم دەبێت. لە کۆتاییدا <code>Liftoff!</code> دەنووسرێت.", "c": "n = 5\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint(\"Liftoff!\")", "o": "5\n4\n3\n2\n1\nLiftoff!"}, {"t": "Pattern Printing: Simple Triangle – سێگۆشەی ئەستێرە", "p": "PDF P.22", "q": "<b>داواکاری:</b> ژمارەی ڕیزەکان (rows) لە بەکارهێنەر بپرسە و بە دوو لووپ سێگۆشەیەک لە ئەستێرە (*) چاپ بکە. (نموونە: rows = 4)", "c": "rows = int(input(\"Enter number of rows: \"))\n\nfor i in range(1, rows + 1):\n    for j in range(1, i + 1):\n        print(\"*\", end=\"\")\n    print()", "o": "Enter number of rows: 4\n*\n**\n***\n****"}, {"tab": "Task 1", "t": "Task 1: Sum of First n Numbers – کۆی n ژمارەی یەکەم", "p": "PDF P.25", "q": "<b>Task 1 (فایل: <code>lab3_sum_first_n.py</code>):</b> بەرنامەیەک بنووسە کە ژمارەیەکی تەواوی ئەرێنی <code>n</code> لە بەکارهێنەر بپرسێت و کۆی n ژمارەی سروشتی یەکەم حیساب بکات: 1 + 2 + 3 + ... + n. (نموونە: n = 5)", "c": "n = int(input(\"Enter a positive integer n: \"))\n\ntotal = 0\nfor i in range(1, n + 1):\n    total = total + i\n\nprint(\"Sum:\", total)", "o": "Enter a positive integer n: 5\nSum: 15"}, {"tab": "Task 2", "t": "Task 2: Factorial Calculator – فاکتۆریاڵ", "p": "PDF P.26", "q": "<b>Task 2 (فایل: <code>lab3_factorial.py</code>):</b> فاکتۆریاڵی ژمارەیەکی تەواوی نەنەرێنی <code>n</code> بە لووپ حیساب بکە: n! = 1 × 2 × 3 × ... × n. حاڵەتی تایبەت: ئەگەر n = 0، فاکتۆریاڵ 1ـە. (نموونە: n = 5)", "c": "n = int(input(\"Enter a non-negative integer n: \"))\n\nfactorial = 1\nfor i in range(1, n + 1):\n    factorial = factorial * i\n\nprint(\"Factorial:\", factorial)", "o": "Enter a non-negative integer n: 5\nFactorial: 120"}, {"tab": "Task 3", "t": "Task 3: Inverted Triangle of Stars – سێگۆشەی پێچەوانە", "p": "PDF P.27", "q": "<b>Task 3 (فایل: <code>lab3_pattern_inverted_triangle.py</code>):</b> ژمارەی ڕیزەکان (rows) لە بەکارهێنەر بپرسە و سێگۆشەیەکی ڕاستی پێچەوانە (inverted) لە ئەستێرە چاپ بکە، بە ژمارەی ڕیزی دیاریکراو. (نموونە: rows = 4)", "c": "rows = int(input(\"Enter number of rows: \"))\n\nfor i in range(rows, 0, -1):\n    for j in range(1, i + 1):\n        print(\"*\", end=\"\")\n    print()", "o": "Enter number of rows: 4\n****\n***\n**\n*"}], "EX": [[["for i in [1, 2, 3]:", "لیستەکە 3 توخمی هەیە: <code>1</code>، <code>2</code> و <code>3</code>. <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 3 خول."], ["print(i)", "print هەر خولێک ئەمە چاپ دەکات: <code>1</code>، <code>2</code> و <code>3</code>."]], [["for i in range(4):", "<code>range(4)</code> ژمارەکانی <code>0</code>، <code>1</code>، <code>2</code> و <code>3</code> دروست دەکات (<code>4</code> ناچێتە ناوی). <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 4 خول."], ["print(i)", "print هەر خولێک ئەمە چاپ دەکات: <code>0</code>، <code>1</code>، <code>2</code> و <code>3</code>."]], [["for i in range(2, 6):", "<code>range(2, 6)</code> ژمارەکانی <code>2</code>، <code>3</code>، <code>4</code> و <code>5</code> دروست دەکات (<code>6</code> ناچێتە ناوی). <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 4 خول."], ["print(i)", "print هەر خولێک ئەمە چاپ دەکات: <code>2</code>، <code>3</code>، <code>4</code> و <code>5</code>."]], [["for i in range(0, 10, 2):", "<code>range(0, 10, 2)</code> ژمارەکانی <code>0</code>، <code>2</code>، <code>4</code>، <code>6</code> و <code>8</code> دروست دەکات (<code>10</code> ناچێتە ناوی). <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 5 خول."], ["print(i)", "print هەر خولێک ئەمە چاپ دەکات: <code>0</code>، <code>2</code>، <code>4</code>، <code>6</code> و <code>8</code>."]], [["total = 0", "گۆڕاوێکمان دروست کرد بە ناوی <code>total</code> و نرخی <code>0</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["for i in range(1, 11):", "<code>range(1, 11)</code> ژمارەکانی <code>1</code>، <code>2</code>، <code>3</code>، ...، <code>9</code> و <code>10</code> دروست دەکات (<code>11</code> ناچێتە ناوی). <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 10 خول."], ["total = total + i", "هەر خولێک حیساب دەکات و ئەنجامەکەی دەخاتە ناو <code>total</code>: <code>0 + 1 = 1</code>، <code>1 + 2 = 3</code>، <code>3 + 3 = 6</code>، ...، <code>36 + 9 = 45</code> و <code>45 + 10 = 55</code>."], ["print(\"Sum:\", total)", "print ئەمە چاپ دەکات: <code>Sum: 55</code>."]], [["count = 1", "گۆڕاوێکمان دروست کرد بە ناوی <code>count</code> و نرخی <code>1</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["while count <= 5:", "مەرجی <code>count &lt;= 5</code> هەر جارێک دەپشکنرێت و هەتا True بێت بلۆکەکە دووبارە دەبێتەوە: <code>1 &lt;= 5 → True</code>، <code>2 &lt;= 5 → True</code>، <code>3 &lt;= 5 → True</code>، <code>4 &lt;= 5 → True</code>، <code>5 &lt;= 5 → True</code>، <code>6 &lt;= 5 → False</code>. کاتێک False بوو لووپەکە دەوەستێت."], ["print(count)", "print هەر خولێک ئەمە چاپ دەکات: <code>1</code>، <code>2</code>، <code>3</code>، <code>4</code> و <code>5</code>."], ["count += 1", "<code>count += 1</code> واتە <code>count = count + 1</code>؛ هەر خولێک نرخی <code>count</code> دەگۆڕێت: <code>1 + 1 = 2</code>، <code>2 + 1 = 3</code>، <code>3 + 1 = 4</code>، <code>4 + 1 = 5</code> و <code>5 + 1 = 6</code>."]], [["age = int(input(\"Enter your age (0-120): \"))", "بەکارهێنەر <code>150</code> نووسی؛ <code>input</code> نووسراو وەردەگرێت، بۆیە <code>int()</code> دەیکات بە ژمارەی تەواو (int) و دەخرێتە ناو <code>age</code> (<code>150</code>)."], ["while age < 0 or age > 120:", "مەرجی <code>age &lt; 0 or age &gt; 120</code> هەر جارێک دەپشکنرێت و هەتا True بێت بلۆکەکە دووبارە دەبێتەوە: <code>150 &lt; 0 or 150 &gt; 120 → True</code>، <code>25 &lt; 0 or 25 &gt; 120 → False</code>. کاتێک False بوو لووپەکە دەوەستێت."], ["print(\"Invalid age. Try again.\")", "print نووسراوی <code>Invalid age. Try again.</code> چاپ دەکات."], ["age = int(input(\"Enter your age (0-120): \"))", "دووبارە پرسیارمان کرد؛ بەکارهێنەر <code>25</code> نووسی، بۆیە نرخی <code>age</code> گۆڕا بۆ <code>25</code>."], ["print(\"Your age is:\", age)", "print ئەمە چاپ دەکات: <code>Your age is: 25</code>."]], [["x = 1", "گۆڕاوێکمان دروست کرد بە ناوی <code>x</code> و نرخی <code>1</code>مان پێدا، لە جۆری int واتە ژمارەی تەواو."], ["while x <= 5:", "مەرجمان پێدا: ئایا <code>5</code> گەورەترە لە <code>1</code>؟ وەڵامەکەی <code>True</code> واتە بەڵێ. چونکە <code>x</code> هیچ کات ناگۆڕێت (<code>x += 1</code> نەنووسراوە)، ئەم مەرجە هەمیشە True دەمێنێتەوە و لووپەکە هەرگیز ناوەستێت."], ["print(x)", "print هەر خولێک <code>1</code> چاپ دەکات، چونکە <code>x</code> نەگۆڕاوە."]], [["for i in range(10):", "<code>range(10)</code> ژمارەکانی <code>0</code>، <code>1</code>، <code>2</code>، ...، <code>8</code> و <code>9</code> دروست دەکات (<code>10</code> ناچێتە ناوی). <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، واتە 10 خول."], ["if i == 5:", "مەرجەکە هەر خولێک دەپشکنرێت: <code>0 == 5 → False</code>، <code>1 == 5 → False</code>، <code>2 == 5 → False</code>، <code>3 == 5 → False</code>، <code>4 == 5 → False</code>، <code>5 == 5 → True</code>."], ["print(\"Found 5!\")", "print نووسراوی <code>Found 5!</code> چاپ دەکات."], ["break", "<code>break</code> لووپەکە دەوەستێنێت؛ هیچ خولێکی تر ناکرێت."], ["print(i)", "print هەر خولێک ئەمە چاپ دەکات: <code>0</code>، <code>1</code>، <code>2</code>، <code>3</code> و <code>4</code>."], ["print(\"Done\")", "print وشەی <code>Done</code> چاپ دەکات."]], [["while True:", "مەرجەکە خۆی <code>True</code> ــە، بۆیە لووپەکە هەمیشە دووبارە دەبێتەوە هەتا <code>break</code> جێبەجێ بێت."], ["text = input(\"Enter word (or 'quit'): \")", "پرسیارێکمان کرد بە <code>input</code>؛ بەکارهێنەر <code>\"hello\"</code> نووسی و خرایە ناو <code>text</code>، لە جۆری str واتە نووسراو."], ["if text == \"quit\":", "مەرجەکە هەر خولێک دەپشکنرێت: <code>\"hello\" == \"quit\" → False</code>، <code>\"python\" == \"quit\" → False</code>، <code>\"quit\" == \"quit\" → True</code>."], ["break", "<code>break</code> لووپەکە دەوەستێنێت؛ هیچ خولێکی تر ناکرێت."], ["print(\"You typed:\", text)", "print هەر خولێک ئەمە چاپ دەکات: <code>You typed: hello</code> و <co {"E": [{"t": "Strings in Python – نووسراو (String)", "p": "PDF P.4", "q": "<b>داواکاری:</b> نووسراو (string) زنجیرەیەک پیتە و بە <code>\"...\"</code> یان <code>'...'</code> دەنووسرێت. گۆڕاوی <code>text</code> بکە بە نووسراوی <code>\"Programming\"</code>. هەر پیتێک شوێنێکی (index) هەیە.", "c": "text = \"Programming\"", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "String Indexing – ئیندێکسی نووسراو", "p": "PDF P.5", "q": "<b>داواکاری:</b> Python لە 0 دەست پێدەکات: یەکەم پیت index 0 ــە، و index نەرێنی لە کۆتاییەوە دەست پێدەکات (<code>-1</code> کۆتا پیتە). یەکەم و کۆتا پیتی <code>\"Python\"</code> چاپ بکە.", "c": "word = \"Python\"\nprint(word[0])  # ئەنجامەکەی P ــە\nprint(word[-1])  # ئەنجامەکەی n ــە", "o": "P\nn"}, {"t": "String Slicing – بڕینی نووسراو", "p": "PDF P.6", "q": "<b>داواکاری:</b> Slicing بەشێک لە نووسراو دەردەهێنێت: <code>string[start:end]</code>؛ start دەخرێتە ناوی و end نا. لە <code>\"Programming\"</code> بەشی 0 تا 6 و بەشی 7 بە دواوە چاپ بکە.", "c": "word = \"Programming\"\nprint(word[0:6])  # ئەنجامەکەی Progra ــە\nprint(word[7:])  # ئەنجامەکەی ming ــە", "o": "Progra\nming"}, {"t": "Slicing with Step – بڕین بە هەنگاو", "p": "PDF P.7", "q": "<b>داواکاری:</b> <code>string[start:end:step]</code> هەنگاوی دیاریکراو بەکاردێنێت. لە <code>\"abcdefg\"</code> هەر دووەم پیت (<code>[::2]</code>) و نووسراوی پێچەوانە (<code>[::-1]</code>) چاپ بکە.", "c": "text = \"abcdefg\"\nprint(text[::2])  # ئەنجامەکەی aceg ــە\nprint(text[::-1])  # نووسراوەکە پێچەوانە دەکاتەوە", "o": "aceg\ngfedcba"}, {"t": "Strings Are Immutable (Invalid) – نووسراو ناگۆڕدرێت", "p": "PDF P.8", "q": "<b>داواکاری:</b> Immutable واتە نووسراو ڕاستەوخۆ ناگۆڕدرێت. ئەمە نادروستە: گۆڕینی پیتی یەکەمی <code>\"Hello\"</code> بە <code>word[0] = \"h\"</code>. Python هەڵەی TypeError دەدات.", "c": "word = \"Hello\"\nword[0] = \"h\"  # هەڵەی TypeError دەدات", "o": "TypeError: 'str' object does not support item assignment"}, {"t": "Strings Are Immutable (Correct) – ڕێگای دروست", "p": "PDF P.8", "q": "<b>داواکاری:</b> ڕێگای دروست: نووسراوێکی نوێ دروست دەکەین. <code>\"h\"</code> دەخەینە پێش بەشی index 1 بە دواوەی <code>word</code> و دەیخەینەوە ناو <code>word</code>.", "c": "word = \"Hello\"\nword = \"h\" + word[1:]  # ئەنجامەکەی hello ــە", "o": "(هیچ نانووسرێت، چونکە print نییە؛ بەهای word دەبێتە \"hello\")"}, {"t": "Common String Operations – کارە باوەکانی نووسراو", "p": "PDF P.9", "q": "<b>داواکاری:</b> بەستنەوە (<code>+</code>)، دووبارەکردنەوە (<code>*</code>)، و درێژی (<code>len()</code>). بۆ <code>a = \"Hello\"</code> و <code>b = \"World\"</code> سێ ئەنجام چاپ بکە.", "c": "a = \"Hello\"\nb = \"World\"\nprint(a + \" \" + b)  # ئەنجامەکەی Hello World ــە\nprint(a * 3)  # ئەنجامەکەی HelloHelloHello ــە\nprint(len(a))  # ئەنجامەکەی 5 ــە", "o": "Hello World\nHelloHelloHello\n5"}, {"t": "Case Conversion Methods – گۆڕینی پیتی گەورە و بچووک", "p": "PDF P.11", "q": "<b>داواکاری:</b> <code>upper()</code> هەموو پیتەکان گەورە، <code>lower()</code> بچووک، و <code>title()</code> پیتی یەکەمی هەر وشەیەک گەورە دەکات. بۆ <code>\"Python Programming\"</code> هەر سێکیان چاپ بکە.", "c": "text = \"Python Programming\"\n\nprint(text.upper())\nprint(text.lower())\nprint(text.title())", "o": "PYTHON PROGRAMMING\npython programming\nPython Programming"}, {"t": "replace() and strip() – replace و strip", "p": "PDF P.12", "q": "<b>داواکاری:</b> <code>strip()</code> بۆشایی سەرەتا و کۆتایی لادەبات و <code>replace(old, new)</code> بەشێک لە نووسراو دەگۆڕێت. بۆ <code>\" I like Java \"</code> هەردووکیان چاپ بکە.", "c": "sentence = \" I like Java \"\nprint(sentence.strip())\nprint(sentence.replace(\"Java\", \"Python\"))", "o": "I like Java\n I like Python "}, {"t": "Checking Strings – پشکنینی نووسراو", "p": "PDF P.13", "q": "<b>داواکاری:</b> <code>isdigit()</code> تەنها ژمارە، <code>isalpha()</code> تەنها پیت، <code>startswith()</code> بە چی دەست پێدەکات، <code>endswith()</code> بە چی کۆتایی دێت. چوار پشکنین لەسەر <code>\"123\"</code> و <code>\"document.pdf\"</code> بکە.", "c": "num = \"123\"\nfile_name = \"document.pdf\"\nprint(num.isdigit())  # ئەنجامەکەی True ــە\nprint(file_name.isalpha())  # ئەنجامەکەی False ــە\nprint(file_name.startswith(\"document\"))  # ئەنجامەکەی True ــە\nprint(file_name.endswith(\".pdf\"))  # ئەنجامەکەی True ــە", "o": "True\nFalse\nTrue\nTrue"}, {"t": "Iterating Through a String – گەڕان بە ناو نووسراو", "p": "PDF P.14", "q": "<b>داواکاری:</b> بە <code>for</code> بە ناو نووسراودا بگەڕێ، هەر خولێک یەک پیت. هەر پیتی <code>\"GPU\"</code> لە هێڵێکدا چاپ بکە.", "c": "word = \"GPU\"\n\nfor char in word:\n    print(char)", "o": "G\nP\nU"}, {"t": "Introduction to Lists – لیست", "p": "PDF P.15", "q": "<b>داواکاری:</b> لیست (list) چەند بەهایەک لە یەک گۆڕاودا هەڵدەگرێت (ژمارە، نووسراو، یان تێکەڵ). دوو لیست دروست بکە: <code>numbers</code> و <code>names</code>.", "c": "numbers = [10, 20, 30]\nnames = [\"Ali\", \"Sara\", \"Omar\"]", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "List Indexing – ئیندێکسی لیست", "p": "PDF P.16", "q": "<b>داواکاری:</b> لیستیش ئیندێکسی لە 0 دەست پێدەکات. یەکەم و کۆتا ناو لە <code>names</code> چاپ بکە. (لیست دەتوانرێت بگۆڕدرێت، بەپێچەوانەی نووسراو.)", "c": "names = [\"Ali\", \"Sara\", \"Omar\"]\n\nprint(names[0])\nprint(names[-1])", "o": "Ali\nOmar"}, {"t": "Modifying Lists – گۆڕینی لیست", "p": "PDF P.17", "q": "<b>داواکاری:</b> توخمی لیست ڕاستەوخۆ دەگۆڕدرێت. ناوی index 1 لە <code>names</code> بکە بە <code>\"Fatima\"</code> و لیستەکە چاپ بکە. (جیاوازی گەورە لەگەڵ نووسراو.)", "c": "names = [\"Ali\", \"Sara\", \"Omar\"]\n\nnames[1] = \"Fatima\"\nprint(names)", "o": "['Ali', 'Fatima', 'Omar']"}, {"t": "List Length and Membership – درێژی و بوونی توخم", "p": "PDF P.18", "q": "<b>داواکاری:</b> <code>len(list)</code> ژمارەی توخمەکان و <code>in</code> ئایا توخمێک لە لیستەکەدایە. درێژی <code>names</code> و ئایا <code>\"Ali\"</code> تێیدایە چاپ بکە.", "c": "names = [\"Ali\", \"Sara\", \"Omar\"]\n\nprint(len(names))  # ئەنجامەکەی 3 ــە\nprint(\"Ali\" in names)  # ئەنجامەکەی True ــە", "o": "3\nTrue"}, {"t": "Adding Elements to a List – زیادکردنی توخم", "p": "PDF P.20", "q": "<b>داواکاری:</b> <code>append()</code> لە کۆتایی زیاد دەکات و <code>insert(index, value)</code> لە شوێنێکی دیاریکراو. بۆ <code>[1, 2, 3]</code> 4 بخەرە کۆتایی و 10 بخەرە index 1، دواتر چاپی بکە.", "c": "numbers = [1, 2, 3]\n\nnumbers.append(4)\nnumbers.insert(1, 10)\n\nprint(numbers)  # ئەنجامەکەی [1, 10, 2, 3, 4] ــە", "o": "[1, 10, 2, 3, 4]"}, {"t": "Removing Elements from a List – سڕینەوەی توخم", "p": "PDF P.21", "q": "<b>داواکاری:</b> <code>remove(value)</code> بە بەها دەسڕێتەوە و <code>pop()</code> بە index (یان کۆتا توخم) دەسڕێتەوە و بەهاکەی دەگەڕێنێتەوە. ئاگاداری: remove ــی بەهایەک کە نییە ValueError دەدات.", "c": "numbers = [1, 2, 3, 4, 5]\nnumbers.remove(2)  # لیستەکە دەبێتە [1, 3, 4, 5]\nprint(numbers)\npopped_value = numbers.pop(0)\nprint(numbers)  # ئەنجامەکەی [3, 4, 5] ــە\nprint(popped_value)  # ئەنجامەکەی 1 ــە", "o": "[1, 3, 4, 5]\n[3, 4, 5]\n1"}, {"t": "Sorting Lists – ڕیزکردنی لیست", "p": "PDF P.22", "q": "<b>داواکاری:</b> <code>sort()</code> بە شێوەی ئاسایی لە بچووکەوە بۆ گەورە ڕیز دەکات؛ <code>reverse=True</code> بۆ پێچەوانە. لیستی <code>[1, 9, 8, 3, 5]</code> ڕیز بکە و چاپی بکە.", "c": "numbers = [1, 9, 8, 3, 5]\nnumbers.sort()  # بۆ پێچەوانە: sort(reverse=True)\nprint(numbers)", "o": "[1, 3, 5, 8, 9]"}, {"t": "Iterating Through a List – گەڕان بە ناو لیست", "p": "PDF P.23", "q": "<b>داواکاری:</b> بە <code>for</code> بە ناو لیستدا بگەڕێ، هەر خولێک یەک توخم. هەموو ناوەکانی <code>names</code> لە هێڵێکدا چاپ بکە.", "c": "names = [\"Ali\", \"Sara\", \"Omar\"]\n\nfor name in names:\n    print(name)", "o": "Ali\nSara\nOmar"}, {"t": "Using Index with Lists – بەکارهێنانی index", "p": "PDF P.24", "q": "<b>داواکاری:</b> کاتێک index پێویستە: <code>range(len(names))</code>. هەر ناوێک لەگەڵ ژمارەی ڕیزەکەی (<code>i+1</code>) چاپ بکە.", "c": "names = [\"Ali\", \"Sara\", \"Omar\"]\n\nfor i in range(len(names)):\n    print(i+1, names[i])", "o": "1 Ali\n2 Sara\n3 Omar"}, {"t": "Task 1: Count Vowels in a String – ژماردنی پیتی دەنگدار", "p": "PDF P.29", "q": "<b>Task 1 (فایل: <code>lab4_count_vowels.py</code>):</b> بەرنامەیەک بنووسە کە ڕستەیەک لە بەکارهێنەر بپرسێت، ژمارەی پیتە دەنگدارەکان (a, e, i, o, u) بژمێرێت و کۆکەی پیشان بدات. پیتی گەورە و بچووک هەردووک دەژمێردرێن (case-insensitive). (نموونە: Hello World)", "c": "sentence = input(\"Enter a sentence: \")\n\ncount = 0\nfor ch in sentence.lower():\n    if ch in \"aeiou\":\n        count += 1\n\nprint(\"Number of vowels:\", count)", "o": "Enter a sentence: Hello World\nNumber of vowels: 3", "tab": "Task 1"}, {"t": "Task 2: Reverse a String – پێچەوانەکردنی نووسراو", "p": "PDF P.30", "q": "<b>Task 2 (فایل: <code>lab4_reverse_string.py</code>):</b> بەرنامەیەک بنووسە کە وشەیەک یان ڕستەیەک لە بەکارهێنەر بپرسێت و وەشانی پێچەوانەی پیشان بدات. (نموونە: Python)", "c": "text = input(\"Enter a word or sentence: \")\n\nprint(\"Reversed:\", text[::-1])", "o": "Enter a word or sentence: Python\nReversed: nohtyP", "tab": "Task 2"}, {"t": "Task 3: Manage a List of Names – بەڕێوەبردنی لیستی ناو", "p": "PDF P.31", "q": "<b>Task 3 (فایل: <code>lab4_manage_names.py</code>):</b> بەرنامەیەکی مینیو بنووسە کە ڕێگە بدات: 1. ناوێک زیاد بکرێت، 2. ناوێک بسڕدرێتەوە، 3. هەموو ناوەکان پیشان بدرێن، 4. دەرچوون. بەرنامەکە کار دەکات هەتا بەکارهێنەر دەرچوون هەڵبژێرێت. (نموونە: 1 Ali، 1 Sara، 2 Ali، 3، 4)", "c": "names = []\n\nwhile True:\n    print(\"1. Add a name\")\n    print(\"2. Remove a name\")\n    print(\"3. Display all names\")\n    print(\"4. Exit\")\n    choice = input(\"Choose (1-4): \")\n\n    if choice == \"1\":\n        name = input(\"Enter a name: \")\n        names.append(name)\n    elif choice == \"2\":\n        name = input(\"Enter a name to remove: \")\n        if name in names:\n            names.remove(name)\n        else:\n            print(\"Name not found\")\n    elif choice == \"3\":\n        print(names)\n    elif choice == \"4\":\n        break\n    else:\n        print(\"Invalid choice\")", "o": "1. Add a name\n2. Remove a nam /* keep everything in sync */
function wrap(name,fn){const o=window[name];if(typeof o!=='function')return;window[name]=function(){const r=o.apply(this,arguments);fn.apply(this,arguments);return r;};}
function wrapBefore(name,fn){const o=window[name];if(typeof o!=='function')return;window[name]=function(){fn.apply(this,arguments);return o.apply(this,arguments);};}
wrap('pinApply',()=>{if(!PS[0].on)revertAll();});
wrap('pinReset',()=>{revertAll();});
wrapBefore('showTab',()=>{winClose();});
wrapBefore('setLab',()=>{winClose();});
wrapBefore('chatToggle',()=>{const f=$('codeFull');if(f.classList.contains('open'))winClose();else{revertAll();if(!ctS.a){ctS.a=1;ctSave();}}});
wrap('pinApply',()=>{try{localStorage.setItem('hs',HS);}catch(_){}});
new MutationObserver(()=>{
 document.querySelectorAll('.code-box.showing-out').forEach(box=>{const c=box.closest('.content'),o=c&&c.querySelector('.example > .output-box .output-content'),v=box.querySelector('.rv-b');if(o&&v&&v.innerHTML!==o.innerHTML)v.innerHTML=o.innerHTML;});
 const w=$('runWin');if(w.classList.contains('open')&&!$('codeFull').classList.contains('open'))winClose();
 else if(w.classList.contains('open')&&!winPend){const o=outEl(curTab-1);if(o){const b=$('runWinBody'),h=o.querySelector('.output-content').innerHTML;if(b.innerHTML!==h)b.innerHTML=h;}}
}).observe($('views'),{childList:true,subtree:true,characterData:true});
new MutationObserver(()=>{if(!$('codeFull').classList.contains('open'))winClose();}).observe($('codeFull'),{attributes:true,attributeFilter:['class']});
})();
</script>
