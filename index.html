<title>Python Laboratory – Lab 2-3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-anchor:none}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto 16px;direction:ltr}
.lab{padding:8px 8px;background:#16a34a;border:2px solid #15803d;border-radius:10px;color:#fff;cursor:pointer;font-size:15px;font-weight:900;font-family:inherit;letter-spacing:.4px;box-shadow:0 3px 9px rgba(0,0,0,.28);transition:all .25s}
.lab:hover{background:#22c55e;transform:translateY(-2px)}
.lab.active{background:#14532d;border-color:#fff;box-shadow:0 0 0 2px #22c55e,0 4px 12px rgba(0,0,0,.4)}
.labs-hr{border:0;height:2px;background:rgba(255,255,255,.55);border-radius:2px;max-width:360px;margin:0 auto 16px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab{padding:12px 22px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;transition:all .3s;backdrop-filter:blur(10px)}
.tab:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.tab.active{background:#fff;color:#667eea;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.content{display:none}.content.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.example{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example-title{flex:1;background:linear-gradient(135deg,#e0f2fe,#bae6fd);padding:14px 18px;border-radius:8px;font-size:17px;font-weight:bold;color:#0c4a6e}
.pdf-page{background:#f97316;color:#fff;font-size:11px;font-weight:bold;padding:5px 11px;border-radius:20px;white-space:nowrap;direction:ltr;box-shadow:0 2px 6px rgba(249,115,22,.35)}
.code-box{background:#1e1e1e;border-radius:10px;margin-bottom:18px;overflow:hidden;border:1px solid #333;display:flex;direction:ltr}
.line-numbers{background:#2d2d2d;border-left:4px solid #5cb85c;padding:18px 0;min-width:42px;text-align:center;font-family:Consolas,Monaco,monospace;font-size:15px;color:#858585;line-height:1.7;user-select:none;flex-shrink:0}
.line-numbers span{display:block;padding:0 8px}
.code-content{padding:18px 20px;overflow-x:auto;flex:1}
.code-content pre{font-family:Consolas,Monaco,monospace;line-height:1.7;white-space:pre;color:#e2e8f0;font-size:15px;text-align:left}
.kw{color:#d4a574;font-weight:700}.dt{color:#bb86fc;font-weight:700}.con{color:#4fc3f7;font-weight:600}.num{color:#b5cea8}.str{color:#ce9178}.cmt{color:#6a9955;font-style:italic}
.output-box{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #3b82f6;border-radius:8px;padding:14px 18px;margin-bottom:18px;direction:ltr;overflow-x:auto}
.output-header{font-weight:bold;color:#1e40af;margin-bottom:8px;font-size:15px}
.output-content{color:#1e3a8a;font-family:Consolas,monospace;font-size:14px;line-height:1.8;white-space:pre;text-align:left}
.expl-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-right:6px solid #22c55e;border-radius:14px;padding:22px 24px}
.expl-title{font-weight:800;color:#166534;margin-bottom:14px;font-size:16px;border-bottom:2px dashed #86efac;padding-bottom:10px}
.expl-box ul{list-style:none}
.expl-box li{margin-bottom:11px;line-height:2;font-size:15px;color:#1c1917;padding:10px 14px;background:#fff;border-radius:9px;border-right:4px solid #22c55e;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rng{flex-shrink:0;min-width:36px;height:24px;line-height:22px;text-align:center;background:#dcfce7;color:#166534;font-weight:800;border:1.5px solid #22c55e;border-radius:5px;padding:0 6px;font-size:13px;margin-top:6px}.sn{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:middle}.sn.sm{font-size:10px}
.ln{background:#22c55e;color:#fff;font-weight:700;font-size:13px;padding:0 10px;border-radius:20px;height:26px;line-height:26px;flex-shrink:0;margin-top:5px;direction:ltr}
.expl-box b{color:#0369a1;background:#dbeafe;padding:1px 7px;border-radius:5px;direction:ltr;display:inline-block;font-family:Consolas,monospace;font-size:13px}
.expl-box code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.intro{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.intro h2{color:#667eea;margin-bottom:18px;font-size:1.9em}.intro p{color:#4b5563;line-height:1.8;margin-bottom:12px}
.expl-box li{flex-direction:column;align-items:flex-start;gap:6px}
.expl-box li>span:last-child{width:100%}
.expl-box .rng{min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px;margin-top:0}
.expl-box .sn{display:block;width:fit-content;max-width:100%;margin-bottom:6px;white-space:pre;text-align:left}
.expl-box .sn{overflow:visible;overflow-x:visible;white-space:normal;overflow-wrap:anywhere}
.sn.xs{font-size:8px}
.cls{color:#4ec9b0}.fn{color:#dcdcaa}.var{color:#9cdcfe}.op{color:#ff79c6}
.more-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
.more-panel{display:none;margin-top:14px;background:#f5f3ff;border:1.5px solid #c4b5fd;border-right:6px solid #7c3aed;border-radius:14px;padding:20px}
.more-panel.open{display:block;animation:fadeIn .4s}
.more-title{font-weight:800;color:#5b21b6;font-size:16px;margin-bottom:10px}
.more-intro,.more-sum{line-height:2;color:#1c1917;font-size:15px;margin-bottom:14px}
.more-panel code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.st{background:#fff;border:1.5px solid #ddd6fe;border-right:5px solid #7c3aed;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.st-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-h .rng{margin-top:0;min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px}
.st-h .sn{white-space:normal;overflow:visible;overflow-wrap:anywhere;background:#dbeafe;color:#0369a1;padding:1px 7px;border-radius:5px}
.st p{line-height:2;font-size:15px;color:#1c1917;margin-bottom:8px}
.st-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#6b7280}
.vs{font-style:normal;background:#ede9fe;color:#4c1d95;border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;direction:ltr;font-size:13px;font-weight:700}
.st p{font-size:16px;line-height:2.1}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#1fa855}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#dc2626}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
.output-box{padding:7px 12px;border-width:1.5px;border-radius:6px;margin-bottom:12px}
.output-header{font-size:12px;margin-bottom:3px}
.output-content{font-size:11px;line-height:1.5}
.st-h{flex-direction:column;align-items:flex-start;gap:6px}
.pin-fab{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
.pin-fab svg{transition:transform .2s}
.pin-wrap.full .pin-fab{border:4px solid #7c3aed}
.pin2.full .pin-fab{border-color:#dc2626}
.pin-wrap.full svg{transform:rotate(45deg)}
.usr{color:#fff;font-weight:800}
.pin-wrap.dock{left:0}
.pin-wrap.dock .pin-fab{opacity:.45;transform:translateX(-32px)}
.pin-wrap.dock .pin-pill{opacity:0;pointer-events:none}
.pin-fab{transition:transform .2s ease,background .2s,opacity .2s}
.pin-fab{touch-action:none;transition:transform .2s ease,background .2s}
.pin-fab.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin-pill{transition:background .15s,color .15s}
.pin-pill{white-space:nowrap;max-width:calc(100vw - 24px);font-size:13px;line-height:1.6;padding:8px 12px}
.pin-pill.hint{background:#7c3aed;color:#fff}.pin2 .pin-pill.hint{background:#dc2626}
.fb-box{margin-top:26px;padding:22px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;text-align:right}
.fb-title{font-weight:800;color:#5b21b6;font-size:17px;margin-bottom:6px}
.fb-sub{color:#6b5b95;font-size:13.5px;margin-bottom:14px;line-height:1.8}
.fb-quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fb-qbtn{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd6fe;background:#fff;border-radius:10px;color:#5b21b6;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.2s}
.fb-qbtn:hover{background:#ede9fe;border-color:#a78bfa}
.fb-overlay{display:none;position:fixed;inset:0;background:rgba(17,12,34,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.fb-overlay.open{display:flex}
.fb-dialog{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.fb-dialog h3{color:#5b21b6;font-size:17px;margin-bottom:14px}
.fb-dialog .fb-qbtn{width:100%;margin-bottom:10px;text-align:center}
.fb-dialog-cancel{width:100%;padding:10px;border:none;background:#f3f4f6;color:#4b5563;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.fb-area{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid #ddd6fe;border-radius:10px;font-family:inherit;font-size:14.5px;resize:vertical;color:#1c1917;box-sizing:border-box;margin-bottom:12px}
.fb-area:focus{outline:none;border-color:#7c3aed}
.fb-send{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.fb-send:hover{filter:brightness(1.07)}
.fb-send:disabled{opacity:.6;cursor:default}
.fb-send2{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.3);margin-top:10px}
.fb-msg{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;border-radius:8px;padding:9px;display:none}
.fb-msg.ok{display:block;background:#dcfce7;color:#166534}
.fb-msg.err{display:block;background:#fee2e2;color:#991b1b}
.code-box.has-tools{flex-wrap:wrap}
.code-tools{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;background:linear-gradient(180deg,#2f2f35,#26262b);border-bottom:1px solid #3b3b44;position:sticky;top:0;z-index:3;direction:ltr}
.ct-l{display:flex;align-items:center;gap:6px}
.ct-l i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5f56}
.ct-l i:nth-child(2){background:#ffbd2e}.ct-l i:nth-child(3){background:#27c93f}
.ct-l b{margin-left:8px;color:#9ca3af;font:600 12px Consolas,monospace;letter-spacing:.5px}
.ct-r{display:flex;align-items:center;gap:10px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08);color:#e5e7eb;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
.copy-btn:hover{background:rgba(255,255,255,.16)}
.copy-btn.done{background:rgba(34,197,94,.22);border-color:#4ade80;color:#86efac}
.ku-sw{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);font-weight:700;font-size:13px;color:#cbd5e1;cursor:pointer;user-select:none;direction:rtl;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,color .25s}
.ku-sw:has(input:checked){background:rgba(59,130,246,.2);border-color:#60a5fa;color:#93c5fd}
.ku-sw input{display:none}
.ku-sw .sw{position:relative;display:inline-block;width:36px;height:12px;margin:5px 4px;border-radius:6px;background:#475569;transition:background .25s;direction:ltr}
.ku-sw .sw::after{content:'';position:absolute;top:-4px;left:-3px;width:20px;height:20px;border-radius:50%;background:#94a3b8;box-shadow:0 2px 5px rgba(0,0,0,.45);transition:left .25s,background .25s,box-shadow .25s}
.ku-sw input:checked+.sw{background:#1e40af}
.ku-sw input:checked+.sw::after{left:19px;background:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.85)}
.code-box.pinned .code-tools{padding:1px 8px}.code-box.pinned .ct-l i{display:none}
@media(max-width:480px){.ct-l{display:none}.code-tools{padding:2px 6px;justify-content:center}.ct-r{flex-wrap:nowrap;justify-content:center;gap:4px;max-width:100%}.copy-btn{padding:2px 7px;font-size:11px;white-space:nowrap;gap:3px}.ku-sw{font-size:11px;gap:3px;padding:0 6px 0 1px;white-space:nowrap}.ku-sw .sw{width:22px;height:8px;margin:5px 2px;border-radius:4px}.ku-sw .sw::after{top:-4px;left:-2px;width:16px;height:16px}.ku-sw input:checked+.sw::after{left:8px}}

<script>
const LABS=[
{E:[],EX:[],EXSUM:[],MORE:[]},
{"E": [{"t": "Boolean Values – بەهای بووڵی (True / False)", "p": "PDF P.4", "q": "<b>داواکاری:</b> دوو گۆڕاو دروست بکە: <code>is_raining</code> بە <code>True</code> و <code>is_sunny</code> بە <code>False</code>. بەهای بووڵی (Boolean) تەنها دوو بەهای هەیە: True یان False.", "c": "is_raining = True\nis_sunny = False", "o": "(هیچ نانووسرێت، چونکە print نییە)"}, {"t": "Comparison Operators – ئۆپەراتۆری بەراورد", "p": "PDF P.6", "q": "<b>داواکاری:</b> <code>age = 18</code> دابنێ و بە ئۆپەراتۆری بەراورد (<code>&gt;=</code> و <code>&lt;</code>) دوو ئەنجام چاپ بکە. ئۆپەراتۆری بەراورد هەمیشە <code>True</code> یان <code>False</code> دەگەڕێنێتەوە. (ئۆپەراتۆرەکان: == != &gt; &lt; &gt;= &lt;=)", "c": "age = 18\nprint(age >= 18)  # ئەنجامەکە True ــە\nprint(age < 18)   # ئەنجامەکە False ــە", "o": "True\nFalse"}, {"t": "Logical Operators – ئۆپەراتۆری لۆجیکی", "p": "PDF P.7", "q": "<b>داواکاری:</b> <code>x = 5</code> دابنێ و بە <code>and</code> و <code>or</code> و <code>not</code> سێ ئەنجام چاپ بکە. <code>and</code>: هەردوو مەرج True بن. <code>or</code>: یەکێکیان True بێت. <code>not</code>: پێچەوانە دەکاتەوە.", "c": "x = 5\nprint(x > 0 and x < 10)  # ئەنجامەکە True ــە\nprint(x < 0 or x > 10)   # ئەنجامەکە False ــە\nprint(not (x == 5))      # ئەنجامەکە False ــە", "o": "True\nFalse\nFalse"}, {"t": "Boolean Expressions in Practice – دەربڕینی بووڵی", "p": "PDF P.8", "q": "<b>داواکاری:</b> نمرەی <code>score = 95</code> بپشکنە ئایا لە 50 گەورەتر یان یەکسانە (دەرچووە)، ئەنجامەکە بخە ناو گۆڕاوی <code>passed</code> و چاپی بکە.", "c": "score = 95\npassed = score >= 50\nprint(passed)  # ئەنجامەکە True ــە", "o": "True"}, {"t": "Introduction to if Statements – فەرمانی if", "p": "PDF P.9", "q": "<b>داواکاری:</b> گۆڕاوی <code>temperature = 35</code> دابنێ. تەنها ئەگەر لە 30 گەورەتر بوو، بنووسە <code>It's hot outside</code>. <code>if</code> بلۆکەکەی تەنها کاتێک جێبەجێ دەکات کە مەرجەکە True بێت.", "c": "temperature = 35\nif temperature > 30:\n    print(\"It's hot outside\")", "o": "It's hot outside"}, {"t": "IF-ELSE Statement – فەرمانی if-else", "p": "PDF P.10", "q": "<b>داواکاری:</b> <code>age = 15</code> دابنێ. ئەگەر 18 یان زیاتر بوو بنووسە <code>Adult</code>، ئەگینا بنووسە <code>Minor</code>. <code>else</code> دەمێنێتەوە بۆ کاتێک مەرجی if False بێت و مەرجی نییە.", "c": "age = 15\nif age >= 18:\n    print(\"Adult\")\nelse:\n    print(\"Minor\")  # ئەم هێڵە چاپ دەکرێت", "o": "Minor"}, {"t": "ELIF Example — Grade System – سیستەمی نمرە", "p": "PDF P.12", "q": "<b>داواکاری:</b> <code>score = 75</code> دابنێ و بە <code>if</code> و <code>elif</code> و <code>else</code> نمرەکە دیاری بکە: 90+ = A، 80+ = B، 70+ = C، 60+ = D، ئەگینا F. مەرجەکان بە ڕیز دەپشکنرێن و یەکەمین True جێبەجێ دەبێت.", "c": "score = 75\n\nif score >= 90:\n    print(\"Grade: A\")\nelif score >= 80:\n    print(\"Grade: B\")\nelif score >= 70:\n    print(\"Grade: C\")  # ئەم هێڵە چاپ دەکرێت\nelif score >= 60:\n    print(\"Grade: D\")\nelse:\n    print(\"Grade: F\")", "o": "Grade: C"}, {"t": "Example: Grade Classification – پۆلێنکردنی نمرە", "p": "PDF P.14", "q": "<b>داواکاری:</b> نمرەیەک (0–100) لە بەکارهێنەر بپرسە. ئەگەر لە 100 گەورەتر یان لە 0 بچووکتر بوو بنووسە <code>Invalid score.</code>، ئەگینا نمرەکە بە A و B و C و D و F دیاری بکە. (نموونە: بەکارهێنەر 105 دەنووسێت)", "c": "score = int(input(\"Enter your score (0–100): \"))\n\nif score > 100 or score < 0:\n    print(\"Invalid score.\")\nelif score >= 90:\n    print(\"Grade: A\")\nelif score >= 80:\n    print(\"Grade: B\")\nelif score >= 70:\n    print(\"Grade: C\")\nelif score >= 60:\n    print(\"Grade: D\")\nelse:\n    print(\"Grade: F\")", "o": "Enter your score (0–100): 105\nInvalid score."}, {"t": "Nested Conditions – مەرجی ناو مەرج", "p": "PDF P.15", "q": "<b>داواکاری:</b> <code>age = 18</code> و <code>has_ticket = True</code> دابنێ. یەکەم ئەگەر تەمەن 18 یان زیاتر بوو، لە ناو ئەو if دا بپشکنە ئایا بلیتی هەیە. (if ــێک لە ناو if ــێکی تر.)", "c": "age = 18\nhas_ticket = True\n\nif age >= 18:\n    if has_ticket:\n        print(\"You can enter\")  # ئەم هێڵە چاپ دەکرێت\n    else:\n        print(\"You need a ticket\")\nelse:\n    print(\"You are too young\")", "o": "You can enter"}, {"t": "Combining Conditions with and – بەستنی مەرج بە and", "p": "PDF P.17", "q": "<b>داواکاری:</b> هەمان نموونەی پێشوو بە شێوەی بێ ناو-مەرج: ئەگەر تەمەن 18 یان زیاتر <b>و</b> بلیتی هەبوو، بنووسە <code>You can enter.</code>. (دوو هێڵی یەکەم لە سڵایدی پێشووەوە هاتوون بۆ ئەوەی کۆدەکە کار بکات.)", "c": "age = 18\nhas_ticket = True\n\nif age >= 18 and has_ticket:\n    print(\"You can enter.\")", "o": "You can enter."}, {"t": "Combining Conditions with and / or – ژمارەی ئەرێنی جووت یان تاک", "p": "PDF P.18", "q": "<b>داواکاری:</b> ژمارەیەک بپرسە و بنووسە ئایا ئەرێنی جووتە (<code>Positive even number</code>)، ئەرێنی تاکە (<code>Positive odd number</code>)، سفرە (<code>Zero</code>)، یان نەرێنی (<code>Negative number</code>). (نموونە: بەکارهێنەر 7 دەنووسێت)", "c": "num = int(input(\"Enter a number: \"))\n\nif num > 0 and num % 2 == 0:\n    print(\"Positive even number\")\nelif num > 0 and num % 2 != 0:\n    print(\"Positive odd number\")\nelif num == 0:\n    print(\"Zero\")\nelse:\n    print(\"Negative number\")", "o": "Enter a number: 7\nPositive odd number"}, {"t": "Largest of Three Numbers – گەورەترین لە سێ ژمارە", "p": "PDF P.19", "q": "<b>داواکاری:</b> گەورەترین ژمارە لە سێ ژمارەی <code>a = 10</code> و <code>b = 14</code> و <code>c = 12</code> بدۆزەرەوە و بیخە ناو <code>largest</code>. بە مەرجەکان: ئەگەر a لە b و c گەورەتر یان یەکسان بوو، ئەوا a؛ ئەگینا ئەگەر b، ئەوا b؛ ئەگینا c.", "c": "a = 10\nb = 14\nc = 12\nif a >= b and a >= c:\n    largest = a\nelif b >= a and b >= c:\n    largest = b\nelse:\n    largest = c\n\nprint(\"Largest:\", largest)", "o": "Largest: 14"}, {"t": "Leap Year Code Example – ساڵی کەبیسە", "p": "PDF P.21", "q": "<b>داواکاری:</b> ساڵێک بپرسە و بنووسە ئایا ساڵی کەبیسە (Leap year) یان نا. ڕێساکان: ئەگەر بە 400 دابەش بوو، کەبیسە؛ ئەگینا ئەگەر بە 100 دابەش بوو، نا؛ ئەگینا ئەگەر بە 4 دابەش بوو، کەبیسە؛ ئەگینا نا. (نموونە: 2024)", "c": "year = int(input(\"Enter a year: \"))\n\nif year % 400 == 0:\n    print(\"Leap year\")\nelif year % 100 == 0:\n    print(\"Not a leap year\")\nelif year % 4 == 0:\n    print(\"Leap year\")\nelse:\n    print(\"Not a leap year\")", "o": "Enter a year: 2024\nLeap year"}, {"t": "Common Pitfall: Overlapping Ranges (Wrong) – مەرجی تێکەڵ (هەڵە)", "p": "PDF P.24", "q": "<b>داواکاری:</b> ئەم کۆدە بخوێنەوە: بۆ <code>score = 85</code> مەرجی یەکەم (<code>score &gt;= 60</code>) پێشتر True ــە، بۆیە مەرجی دووەم هەرگیز ناپشکنرێت و B هەرگیز نانووسرێت.", "c": "score = 85\nif score >= 60:\n    print(\"D\")\nelif score >= 80:\n    print(\"B\")", "o": "D"}, {"t": "Common Pitfall: Overlapping Ranges (Correct) – مەرجی تێکەڵ (ڕاست)", "p": "PDF P.24", "q": "<b>داواکاری:</b> وەشانی ڕاستی هەمان کۆد: مەرجی گەورەتر (<code>score &gt;= 80</code>) پێش مەرجی بچووکتر (<code>score &gt;= 60</code>) دەنووسرێت، و <code>else</code> بۆ ئەوانەی دەرناچن.", "c": "score = 85\nif score >= 80:\n    print(\"B\")\nelif score >= 60:\n    print(\"D\")\nelse:\n    print(\"Fail\")", "o": "B"}, {"t": "Task 1: Positive, Negative, or Zero – ئەرێنی، نەرێنی، یان سفر", "p": "PDF P.25", "q": "<b>Task 1 (فایل: <code>lab2_sign_checker.py</code>):</b> بەرنامەیەک بنووسە کە ژمارەیەک لە بەکارهێنەر بپرسێت (<code>Enter a number: </code>) و چاپی بکات: ئەگەر لە 0 گەورەتر بوو <code>Positive</code>، ئەگەر لە 0 بچووکتر بوو <code>Negative</code>، ئەگەر 0 بوو <code>Zero</code>. (نموونە: -4)", "c": "num = int(input(\"Enter a number: \"))\n\nif num > 0:\n    print(\"Positive\")\nelif num < 0:\n    print(\"Negative\")\nelse:\n    print(\"Zero\")", "o": "Enter a number: -4\nNegative", "tab": "Task 1"}, {"t": "Task 2: Ticket Price Based on Age – نرخی بلیت بەپێی تەمەن", "p": "PDF P.26", "q": "<b>Task 2 (فایل: <code>lab2_ticket_price.py</code>):</b> سینەما نرخی بلیت بەپێی تەمەن دیاری دەکات: لە خوار 5 ساڵ بەخۆڕایی، 5 تا 17 منداڵ (3000 IQD)، 18 تا 64 گەورە (5000 IQD)، 65 و سەرەوە بەساڵاچوو (4000 IQD). تەمەن بپرسە و نرخەکە چاپ بکە. ئەگەر نەرێنی یان لە 120 زیاتر بوو، <code>Invalid age</code> بنووسە. (نموونە: 30)", "c": "age = int(input(\"Enter your age: \"))\n\nif age < 0 or age > 120:\n    print(\"Invalid age\")\nelif age < 5:\n    print(\"Free\")\nelif age <= 17:\n    print(\"Child ticket: 3000 IQD\")\nelif age <= 64:\n    print(\"Adult ticket: 5000 IQD\")\nelse:\n    print(\"Senior ticket: 4000 IQD\")", "o": "Enter your age: 30\nAdult ticket: 5000 IQD", "tab": "Task 2"}, {"t": "Task 3: Simple Login Simulation – شبیهەسازی چوونەژوورەوە", "p": "PDF P.27", "q": "<b>Task 3 (فایل: <code>lab2_login.py</code>):</b> ناوی بەکارهێنەری دروست <code>admin</code> و وشەی نهێنی دروست <code>1234</code> ــە. ناو و وشەی نهێنی بپرسە: ئەگەر هەردووک دروست بوون <code>Login successful</code>؛ ئەگەر ناو هەڵە و وشەی نهێنی دروست <code>Wrong username</code>؛ ئەگەر ناو دروست و وشەی نهێنی هەڵە <code>Wrong password</code>؛ ئەگەر هەردووک هەڵە <code>Wrong username and password</code>. (نموونە: admin و 0000)", "c": "username = input(\"Enter username: \")\npassword = input(\"Enter password: \")\n\nif username == \"admin\" and password == \"1234\":\n    print(\"Login successful\")\nelif username != \"admin\" and password == \"1234\":\n    print(\"Wrong username\")\nelif username == \"admin\" and password != \"1234\":\n    print(\"Wrong password\")\nelse:\n    print(\"Wrong username and password\")", "o": "Enter username: admin\nEnter password: 0000\nWrong password", "tab": "Task 3"}, {"t": "Task 4: Number Range Classifier – پۆلێنکردنی ژمارە بەپێی ماوە", "p": "PDF P.28", "q": "<b>Task 4 (فایل: <code>lab2_range_classifier.py</code>):</b> ژمارەیەکی تەواو بخوێنەوە و بنووسە: <code>Small</code> ئەگەر لە نێوان 1 و 10 بوو (لەگەڵ خۆیاندا)، <code>Medium</code> ئەگەر لە نێوان 11 و 100 بوو، <code>Large</code> ئەگەر لە 100 گەورەتر بوو، و <code>Zero or negative</code> ئەگەر 0 یان کەمتر بوو. بە if و elif و else. (نموونە: 50)", "c": "num = int(input(\"Enter an integer: \"))\n\nif num <= 0:\n    print(\"Zero or negative\")\nelif num <= 10:\n    print(\"Small\")\nelif num <= 100:\n    print(\"Medium\")\nelse:\n    print(\"Large\")", "o": "Enter an integer: 50\nMedium", "tab": "Task 4"}], "EX": [[["is_raining = True", "گۆڕاوی <code>is_raining</code> دروست دەکات لە جۆری bool و بەهای <code>True</code>ی دەداتێ. True بە پیتی گەورەی T دەنووسرێت."], ["is_sunny = False", "گۆڕاوی <code>is_sunny</code> دروست دەکات لە جۆری bool و بەهای <code>False</code>ی دەداتێ. هیچ لەسەر شاشە پیشان نادرێت چونکە print نییە."]], [["age = 18", "گۆڕاوی <code>age</code> دروست دەکات لە جۆری int و بەهای 18ی دەداتێ."], ["print(age >= 18)", "پشکنین: <code>18 &gt;= 18</code>. 18 یەکسانە بە 18، بۆیە <code>&gt;=</code> ئەنجامی <code>True</code> دەدات و ئەمە چاپ دەکرێت."], ["print(age < 18)", "پشکنین: <code>18 &lt; 18</code>. 18 لە 18 بچووکتر نییە (یەکسانن)، بۆیە ئەنجام <code>False</code> ــە و ئەمە چاپ دەکرێت."]], [["x = 5", "گۆڕاوی <code>x</code> دروست دەکات لە جۆری int و بەهای 5ی دەداتێ."], ["print(x > 0 and x < 10)", "<code>and</code> دەڵێت هەردوو مەرجەکە True بن: <code>5 &gt; 0</code> True ــە و <code>5 &lt; 10</code> True ــە، بۆیە ئەنجام <code>True</code>."], ["print(x < 0 or x > 10)", "<code>or</code> دەڵێت یەکێکیان True بێت بەس: <code>5 &lt; 0</code> False ــە و <code>5 &gt; 10</code> False ــە، هیچیان True نییە، بۆیە <code>False</code>."], ["print(not (x == 5))", "<code>x == 5</code> True ــە (5 یەکسانە بە 5). <code>not</code> پێچەوانەی دەکاتەوە: not True = <code>False</code>."]], [["score = 95", "گۆڕاوی <code>score</code> دروست دەکات لە جۆری int و بەهای 95ی دەداتێ."], ["passed = score >= 50", "دەربڕینی <code>95 &gt;= 50</code> دەپشکنێت. ئەنجامەکە <code>True</code> ــە و دەیخاتە ناو <code>passed</code> (bool). واتە گۆڕاو دەتوانێت ئەنجامی پرسیارێک هەڵبگرێت. هیچ چاپ نابێت."], ["print(passed)", "بەهای <code>passed</code> چاپ دەکات: <code>True</code>."]], [["temperature = 35", "گۆڕاوی <code>temperature</code> دروست دەکات لە جۆری int و بەهای 35ی دەداتێ."], ["if temperature > 30:", "مەرجی <code>35 &gt; 30</code> دەپشکنێت. ")", "جێبەجێ نابێت.", []], ["else:", "هەردوو مەرج False بوون، بۆیە جێبەجێ دەبێت.", []], ["print(\"Large\")", "دەنووسێت <code>Large</code>.", []]], "sum": "پوختە: ڕیزبەندی مەرجەکان ماوەکان دابەش دەکات، و else ئەوەی دەمێنێتەوە دەگرێت."}]},
{"E": [{"t": "The for Loop – لووپی for", "p": "PDF P.6", "q": "<b>داواکاری:</b> لیستی <code>[1, 2, 3]</code> بەکاربهێنە و بە <code>for</code> هەر توخمێکی بخەرە ناو <code>i</code> و چاپی بکە. لووپەکە هەر توخمێک وەردەگرێت، دەیداتە <code>i</code>، و بلۆکەکە بۆ هەر توخمێک یەک جار جێبەجێ دەکات.", "c": "for i in [1, 2, 3]:\n    print(i)", "o": "1\n2\n3"}, {"t": "for Loop with range() – لووپی for لەگەڵ range()", "p": "PDF P.7", "q": "<b>داواکاری:</b> <code>range()</code> زنجیرەیەک ژمارە دروست دەکات. بە <code>range(4)</code> ژمارەکان لە 0 تا stop-1 بەرهەم بهێنە و بە <code>for</code> هەموویان چاپ بکە.", "c": "for i in range(4):\n    print(i)", "o": "0\n1\n2\n3"}, {"t": "range(2, 6) – range بە start و stop", "p": "PDF P.8", "q": "<b>داواکاری:</b> ئەمجارە <code>range(2, 6)</code> بەکاربهێنە: دەستپێک (start) ــە 2 و کۆتایی (stop) ــە 6. ژمارەکان بە <code>for</code> چاپ بکە. تێبینی: start دەخرێتە ناو ژمارەکانەوە، بەڵام stop نایخرێتە ناوی.", "c": "for i in range(2, 6):\n    print(i)", "o": "2\n3\n4\n5"}, {"t": "range(0, 10, 2) – range بە step", "p": "PDF P.8", "q": "<b>داواکاری:</b> <code>range(0, 10, 2)</code> بەکاربهێنە: start = 0، stop = 10، و step = 2 (هەر جارێک 2 زیاد بکات). ژمارەکان چاپ بکە.", "c": "for i in range(0, 10, 2):\n    print(i)", "o": "0\n2\n4\n6\n8"}, {"t": "Practical Example: Sum of 1 to 10 – کۆی 1 تا 10", "p": "PDF P.9", "q": "<b>داواکاری:</b> کۆی ژمارەکانی 1 تا 10 بدۆزەرەوە. بە <code>total = 0</code> دەست پێبکە و لە هەر خولێکدا <code>i</code> بخە سەر <code>total</code>، دواتر کۆی کۆتایی چاپ بکە. (PDF: i = 1 → total = 1، i = 2 → total = 3 ... i = 10 → total = 55)", "c": "total = 0\nfor i in range(1, 11):\n    total = total + i\n\nprint(\"Sum:\", total)", "o": "Sum: 55"}, {"t": "The while Loop Concept – لووپی while", "p": "PDF P.10", "q": "<b>داواکاری:</b> <code>while</code> هەتا مەرجێک True بێت دووبارە دەبێتەوە. گۆڕاوی <code>count</code> لە 1 دەست پێبکە و تا 5 چاپی بکە، و لە هەر خولێکدا یەک زیادی بکە.", "c": "count = 1\nwhile count <= 5:\n    print(count)\n    count += 1", "o": "1\n2\n3\n4\n5"}, {"t": "Example: Input Until Valid – داخڵکردن هەتا دروست بێت", "p": "PDF P.12", "q": "<b>داواکاری:</b> تەمەن لە بەکارهێنەر بپرسە. هەتا تەمەنەکە لە دەرەوەی 0 تا 120 بێت، پەیامی هەڵە پیشان بدە و دووبارە بپرسە. (لە دەرەنجامدا نموونەی نووسینی 150 و دواتر 25 هاتووە.)", "c": "age = int(input(\"Enter your age (0-120): \"))\n\nwhile age < 0 or age > 120:\n    print(\"Invalid age. Try again.\")\n    age = int(input(\"Enter your age (0-120): \"))\n\nprint(\"Your age is:\", age)", "o": "Enter your age (0-120): 150\nInvalid age. Try again.\nEnter your age (0-120): 25\nYour age is: 25"}, {"t": "Infinite Loops – لووپی بێ کۆتایی", "p": "PDF P.13", "q": "<b>داواکاری:</b> ئەم کۆدە بۆچی دەبێتە لووپی بێ کۆتایی (infinite loop)؟ گۆڕاوی <code>x</code> لە 1 دەست پێدەکات، بەڵام هەڵەکە ئەوەیە <code>x += 1</code> نەنووسراوە.", "c": "x = 1\nwhile x <= 5:\n    print(x)\n    # x += 1 نەنووسراوە", "o": "1\n1\n1\n1\n... (هەرگیز ناوەستێت؛ بۆ ڕاگرتن Ctrl+C بکە)"}, {"t": "The break Statement – فەرمانی break", "p": "PDF P.14", "q": "<b>داواکاری:</b> لە <code>range(10)</code> ژمارەکان چاپ بکە، بەڵام کاتێک <code>i</code> دەگاتە 5، <code>Found 5!</code> بنووسە و بە <code>break</code> لە لووپەکە دەربچۆ. لە کۆتاییدا <code>Done</code> چاپ بکە.", "c": "for i in range(10):\n    if i == 5:\n        print(\"Found 5!\")\n        break  # لە لووپەکە دەرچۆ\n    print(i)\n\nprint(\"Done\")", "o": "0\n1\n2\n3\n4\nFound 5!\nDone"}, {"t": "break in while Loop – break لە لووپی while", "p": "PDF P.15", "q": "<b>داواکاری:</b> بە <code>while True</code> دووبارە وشەیەک بپرسە و چاپی بکە. کاتێک بەکارهێنەر <code>quit</code> دەنووسێت بە <code>break</code> لووپەکە بوەستێنە و <code>Goodbye!</code> بنووسە. (نموونەی نووسین: hello، python، quit)", "c": "while True:\n    text = input(\"Enter word (or 'quit'): \")\n    if text == \"quit\":\n        break\n    print(\"You typed:\", text)\n\nprint(\"Goodbye!\")", "o": "Enter word (or 'quit'): hello\nYou typed: hello\nEnter word (or 'quit'): python\nYou typed: python\nEnter word (or 'quit'): quit\nGoodbye!"}, {"t": "The continue Statement – فەرمانی continue", "p": "PDF P.16", "q": "<b>داواکاری:</b> لە <code>range(1, 6)</code> تەنها ژمارە تاکەکان چاپ بکە. ئەگەر <code>i</code> جووت بوو، بە <code>continue</code> بڕۆ بۆ خولی دواتر.", "c": "for i in range(1, 6):\n    if i % 2 == 0:\n        continue  # ئەگەر جووت بوو، بچۆ بۆ خولی دواتر\n    print(i)", "o": "1\n3\n5"}, {"t": "Nested Loops – لووپی ناو لووپ", "p": "PDF P.18", "q": "<b>داواکاری:</b> دوو <code>for</code> لە ناو یەک بنووسە. لووپی ناوەوە بۆ هەر خولێکی لووپی دەرەوە بە تەواوی دووبارە دەبێتەوە. هەر جارێک بەهای <code>i</code> و <code>j</code> چاپ بکە.", "c": "for i in range(1, 4):\n    for j in range(1, 4):\n        print(\"i =\", i, \", j =\", j)", "o": "i = 1 , j = 1\ni = 1 , j = 2\ni = 1 , j = 3\ni = 2 , j = 1\ni = 2 , j = 2\ni = 2 , j = 3\ni = 3 , j = 1\ni = 3 , j = 2\ni = 3 , j = 3"}, {"t": "Nested Loops — Multiplication Table – خشتەی لێکدان", "p": "PDF P.19", "q": "<b>داواکاری:</b> بە دوو لووپ خشتەی لێکدان چاپ بکە. لووپی دەرەوە هەر ڕیزێک (i) و لووپی ناوەوە هەر ستوونێک (j) دەگرێت. تێبینی: لە سڵایدەکە نووسراوە 3×3، بەڵام کۆدەکە <code>range(1, 6)</code> بەکاردێنێت، بۆیە خشتەکە 5×5 دەبێت.", "c": "for i in range(1, 6):\n    for j in range(1, 6):\n        print(i * j, end=\"\\t\")\n    print()  # دەچێتە هێڵی دواتر", "o": "1\t2\t3\t4\t5\t\n2\t4\t6\t8\t10\t\n3\t6\t9\t12\t15\t\n4\t8\t12\t16\t20\t\n5\t10\t15\t20\t25\t"}, {"t": "Loop Tracing Example (for) – شوێنکەوتنی لووپ", "p": "PDF P.20", "q": "<b>داواکاری:</b> ئەم کۆدە بخوێنەوە و وەڵامی ئەم دوو پرسیارە بدەرەوە: ١- <code>print(\"Outer:\", i)</code> چەند جار جێبەجێ دەبێت؟ ٢- <code>print(\"  Inner:\", j)</code> چەند جار جێبەجێ دەبێت؟ (وەڵام: 3 جار و 6 جار)", "c": "for i in range(1, 4):\n    print(\"Outer:\", i)\n    for j in range(1, 3):\n        print(\"  Inner:\", j)", "o": "Outer: 1\n  Inner: 1\n  Inner: 2\nOuter: 2\n  Inner: 1\n  Inner: 2\nOuter: 3\n  Inner: 1\n  Inner: 2"}, {"t": "Loop Tracing Example (while) – شوێنکەوتنی while", "p": "PDF P.21", "q": "<b>داواکاری:</b> ئەم کۆدە چی دەنووسێت؟ <code>n</code> لە 5 دەست پێدەکات و لە هەر خولێکدا یەک کەم دەبێت. لە کۆتاییدا <code>Liftoff!</code> دەنووسرێت.", "c": "n = 5\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint(\"Liftoff!\")", "o": "5\n4\n3\n2\n1\nLiftoff!"}, {"t": "Pattern Printing: Simple Triangle – سێگۆشەی ئەستێرە", "p": "PDF P.22", "q": "<b>داواکاری:</b> ژمارەی ڕیزەکان (rows) لە بەکارهێنەر بپرسە و بە دوو لووپ سێگۆشەیەک لە ئەستێرە (*) چاپ بکە. (نموونە: rows = 4)", "c": "rows = int(input(\"Enter number of rows: \"))\n\nfor i in range(1, rows + 1):\n    for j in range(1, i + 1):\n        print(\"*\", end=\"\")\n    print()", "o": "Enter number of rows: 4\n*\n**\n***\n****"}, {"t": "Task 1: Sum of First n Numbers – کۆی n ژمارەی یەکەم", "p": "PDF P.25", "q": "<b>Task 1 (فایل: <code>lab3_sum_first_n.py</code>):</b> بەرنامەیەک بنووسە کە ژمارەیەکی تەواوی ئەرێنی <code>n</code> لە بەکارهێنەر بپرسێت و کۆی n ژمارەی سروشتی یەکەم حیساب بکات: 1 + 2 + 3 + ... + n. (نموونە: n = 5)", "c": "n = int(input(\"Enter a positive integer n: \"))\n\ntotal = 0\nfor i in range(1, n + 1):\n    total = total + i\n\nprint(\"Sum:\", total)", "o": "Enter a positive integer n: 5\nSum: 15"}, {"t": "Task 2: Factorial Calculator – فاکتۆریاڵ", "p": "PDF P.26", "q": "<b>Task 2 (فایل: <code>lab3_factorial.py</code>):</b> فاکتۆریاڵی ژمارەیەکی تەواوی نەنەرێنی <code>n</code> بە لووپ حیساب بکە: n! = 1 × 2 × 3 × ... × n. حاڵەتی تایبەت: ئەگەر n = 0، فاکتۆریاڵ 1ـە. (نموونە: n = 5)", "c": "n = int(input(\"Enter a non-negative integer n: \"))\n\nfactorial = 1\nfor i in range(1, n + 1):\n    factorial = factorial * i\n\nprint(\"Factorial:\", factorial)", "o": "Enter a non-negative integer n: 5\nFactorial: 120"}, {"t": "Task 3: Inverted Triangle of Stars – سێگۆشەی پێچەوانە", "p": "PDF P.27", "q": "<b>Task 3 (فایل: <code>lab3_pattern_inverted_triangle.py</code>):</b> ژمارەی ڕیزەکان (rows) لە بەکارهێنەر بپرسە و سێگۆشەیەکی ڕاستی پێچەوانە (inverted) لە ئەستێرە چاپ بکە، بە ژمارەی ڕیزی دیاریکراو. (نموونە: rows = 4)", "c": "rows = int(input(\"Enter number of rows: \"))\n\nfor i in range(rows, 0, -1):\n    for j in range(1, i + 1):\n        print(\"*\", end=\"\")\n    print()", "o": "Enter number of rows: 4\n****\n***\n**\n*"}], "EX": [[["for i in [1, 2, 3]:", "لیستی <code>[1, 2, 3]</code> سێ توخمی هەیە. هەر خولێک یەکێکیان دەخاتە ناو <code>i</code> (int): یەکەم جار <code>i = 1</code>، پاشان 2، پاشان 3. دوای 3 توخمی نەماوە و لووپەکە دەوەستێت."], ["print(i)", "بەهای ئێستای <code>i</code> چاپ دەکات. چونکە سێ جار جێبەجێ دەبێت، 1 و 2 و 3 لە سێ هێڵی جیادا دەنووسرێن. ئەم هێڵە بە 4 بۆشایی لە ژێر <code>for</code> نووسراوە، بۆیە ئەندامی لووپەکەیە."]], [["for i in range(4):", "<code>range(4)</code> چوار ژمارە دروست دەکات: 0 و 1 و 2 و 3. ژمارە 4 ناچێتە ناوی چونکە stop (4) هەرگیز بەشێک نییە. <code>i</code> هەر خولێک یەکێکیان وەردەگرێت."], ["print(i)", "<code>i</code> چاپ دەکات: 0 و 1 و 2 و 3، هەر یەکە لە هێڵێکدا. بلۆکەکە چوار جار جێبەجێ دەبێت، بۆیە چوار هێڵ دەنووسرێت."]], [["for i in range(2, 6):", "<code>range(2, 6)</code> ژمارەکانی 2 و 3 و 4 و 5 دروست دەکات: لە 2 دەست پێدەکات و پێش 6 دەوەستێت (6 خۆی نییە). <code>i</code> هەر خولێک (iteration) یەکێکیان وەردەگرێت."], ["print(i)", "بەهای <code>i</code> چاپ دەکات: 2 و 3 و 4 و 5، هەر یەکە لە هێڵێکدا. چوار جار جێبەجێ دەبێت."]], [["for i in range(0, 10, 2):", "<code>range(0, 10, 2)</code>: لە 0 دەست پێدەکات و هەر جارێک 2 زیاد دەکات: 0 و 2 و 4 و 6 و 8. ژمارەی دواتر 10ـە و 10 بەشێک نییە، بۆیە لێرە دەوەستێت."], ["print(i)", "بەهای <code>i</code> چاپ دەکات: 0 و 2 و 4 و 6 و 8، هەر یەکە لە هێڵێکدا. پێنج جار جێبەجێ دەبێت."]], [["total = 0", "گۆڕاوی <code>total</code> دروست دەکات لە جۆری int و بەهای 0ی دەداتێ. ئەمە شوێنی کۆکردنەوەیە و لە 0 دەست پێدەکات."], ["for i in range(1, 11):", "<code>range(1, 11)</code> ژمارەکانی 1 تا 10 دروست دەکات (11 نییە). <code>i</code> هەر خولێک دەبێتە 1 و 2 و 3 ... تا 10، بۆیە 10 خول دەبێت."], ["total = total + i", "بەهای کۆنی <code>total</code> لەگەڵ <code>i</code> کۆ دەکات و ئەنجامەکە دەخاتەوە ناو <code>total</code>. خولی 1: 0 + 1 = 1. خولی 2: 1 + 2 = 3. خولی 3: 3 + 3 = 6. خولی 10: 45 + 10 = 55."], ["print(\"Sum:\", total)", "ئەم هێڵە بێ بۆشاییە، واتە لە دەرەوەی لووپەکەیە. بۆیە یەک جار دوای دە خولەکە جێبەجێ دەبێت و دەنووسێت <code>Sum: 55</code>."]], [["count = 1", "گۆڕاوی <code>count</code> دروست دەکات لە جۆری int و بەهای 1ی دەداتێ."], ["while count <= 5:", "مەرجەکە <code>count &lt;= 5</code> دەپشکنێت. هەتا True بێت بلۆکەکە دووبارە دەبێتەوە. یەکەم جار 1 &lt;= 5 واتە True. کاتێک <code>count</code> دەبێتە 6، مەرجەکە (6 &lt;= 5) False دەبێت و لووپەکە دەوەستێت."], ["print(count)", "بەهای ئێستای <code>count</code> چاپ دەکات: 1 و 2 و 3 و 4 و 5."], ["count += 1", "<code>count += 1</code> واتە <code>count = count + 1</code>، یانی یەک زیاد دەکات. خولی 1: 1 دەبێتە 2. خولی 5: 5 دەبێتە 6. بێ ئەم هێڵە <code>count</code> هەمیشە 1 دەمێنێتەوە و لووپەکە هەرگیز نادەستێت."]], [["age = int(input(\"Enter your age (0-120): \"))", "<code>input()</code> پرسیارەکە پیشان دەدات و ئەوەی بەکارهێنەر دەینووسێت وەک نووسراو (str) وەردەگرێت. <code>int()</code> دەیکات بە ژمارەی تەواو (int). لێرە 150 دەنووسرێت، بۆیە <code>age = 150</code>."], ["while age < 0 or age > 120:", "پشکنین بۆ 150: <code>150 &lt; 0</code> False ــە، بەڵام <code>150 &gt; 120</code> True ــە. لە <code>or</code> یەکێک True بێت هەموو مەرجەکە True دەبێت، بۆیە لووپەکە دەست پێدەکات. کاتێک <code>age = 25</code> بێت هەردووکیان False دەبن و دەوەستێت."], ["print(\"Invalid age. Try again.\")", "150 هەڵەیە، بۆیە دەنووسێت <code>Invalid age. Try again.</code>. ئەم هێڵە یەک جار جێبەجێ دەبێت چونکە دواتر 25 دەنووسرێت."], ["age = int(input(\"Enter your age (0-120): \"))", "دووبارە دەپرسێت. لێرە 25 دەنووسرێت، بۆیە <code>age</code> دەبێتە 25 (int). ئینجا مەرجی while دووبارە دەپشکنرێت و False دەبێت."], ["print(\"Your age is:\", age)", "لە دەرەوەی لووپەکەیە. دوای دروستبوونی تەمەن دەنووسێت <code>Your age is: 25</code>."]], [["x = 1", "گۆڕاوی <code>x</code> دروست دەکات لە جۆری int و بەهای 1ی دەداتێ."], ["while x <= 5:", "مەرجەکە <code>x &lt;= 5</code> ــە. چونکە <code>x</code> هەمیشە 1 دەمێنێتەوە، 1 &lt;= 5 هەمیشە True ــە، بۆیە مەرجەکە هەرگیز False نابێت."], ["print(x)", "هەر خولێک 1 چاپ دەکات، چونکە بەهای <code>x</code> نەگۆڕاوە. بۆیە 1 بێ وەستان دەنووسرێت."]], [["for i in range(10):", "<code>range(10)</code> ژمارەکانی 0 تا 9 دروست دەکات. <code>i</code> هەر خولێک یەکێکیان وەردەگرێت، بەڵام لووپەکە لە <code>i = 5</code> دەوەستێت."], ["if i == 5:", "دەپشکنێت ئایا <code>i</code> یەکسانە بە 5. (<code>==</code> بۆ بەراوردکردنە، <code>=</code> بۆ دانانی بەهایە.) بۆ 0 و 1 و 2 و 3 و 4 False ــە، و بۆ 5 True ــە."], ["print(\"Found 5!\")", "تەنها کاتێک <code>i = 5</code> بێت جێبەجێ دەبێت و دەنووسێت <code>Found 5!</code>."], ["break", "لووپەکە دەوەستێنێت. هێڵی <code>print(i)</code> بۆ 5 و ژمارەکانی 6 و 7 و 8 و 9 هەرگیز جێبەجێ نابن."], ["print(i)", "بۆ 0 و 1 و 2 و 3 و 4 چاپ دەکات، چونکە ئەو کاتانە <code>if</code> False بوو. <code>i = 5</code> نایگاتێ چونکە <code>break</code> پێشتر دەرچووە."], ["print(\"Done\")", "بێ بۆشاییە، واتە لە دەرەوەی لووپەکەیە. دوای <code>break</code> جێبەجێ دەبێت و دەنووسێت <code>Done</code>."]], [["while True:", "مەرجەکە خۆی <code>True</code> ــە، بۆیە هەمیشە True دەمێنێتەوە. لووپەکە تەنها بە <code>break</code> دەوەستێت."], ["text = input(\"Enter word (or 'quit'): \")", "وشەیەک وەردەگرێت و دەیخاتە ناو <code>text</code> (str). خولی 1: <code>text = \"hello\"</code>، خولی 2: <code>\"python\"</code>، خولی 3: <code>\"quit\"</code>."], ["if text == \"quit\":", "دەپشکنێت ئایا <code>text</code> یەکسانە بە <code>\"quit\"</code>. بۆ hello و python False ــە، بۆ quit True ــە."], ["break", "تەنها کاتێک <code>text = \"quit\"</code> بێت جێبەجێ دەبێت و لووپەکە دەوەستێنێت."], ["print(\"You typed:\", text)", "بۆ hello و python دەنووسێت <code>You typed: hello</code> و <code>You typed: python</code>. بۆ quit نایگاتێ چونکە break پێشتر دەرچووە."], ["print(\"Goodbye!\")", "لە دەرەوەی لووپەکەیە و دوای break یەک جار دەنووسێت <code>Goodbye!</code>."]], [["for i in range(1, 6):", "<code>range(1, 6)</code> ژمارەکانی 1 و 2 و 3 و 4 و 5 دروست دەکات. <code>i</code> هەر خولێک یەکێکیان وەردەگرێت."], ["if i % 2 == 0:", "<code>%</code> ماوەی دابەشکردن (باقی) دەدات. <code>i % 2 == 0</code> واتە i جووتە. i = 1: 1 % 2 = 1 False. i = 2: 0 True. i = 3: 1 False. i = 4: 0 True. i = 5: 1 False."], ["continue", "کاتێک جێبەجێ دەبێت (لە i = 2 و 4) ئەو خولە ڕادەگرێت و لووپەکە دەچێتە خولی دواتر. <code>print(i)</code>ی ئەو خولە نانووسرێت."], ["print(i)", "تەنها بۆ i = 1 و 3 و 5 چاپ دەکات، چونکە بۆ ئەوان <code>if</code> False ــە."]], [["for i in range(1, 4):", "لووپی دەرەوەیە. <code>i</code> دەبێتە 1 و 2 و 3."], ["for j in range(1, 4):", "لووپی ناوەوەیە. بۆ هەر <code>i</code>، <code>j</code> بە تەواوی 1 و 2 و 3 دەبێت. بۆیە 3 * 3 = 9 جار دەگەڕێتەوە."], ["print(\"i =\", i, \", j =\", j)", "9 جار جێبەجێ دەبێت. پایتۆن لە نێوان بەهاکان بۆشایی دادەنێت، بۆیە دەنووسێت <code>i = 1 , j = 1</code> تا <code>i = 3 , j = 3</code>."]], [["for i in range(1, 6):", "لووپی دەرەوە: هەر ڕیزێک. <code>i</code> دەبێتە 1 و 2 و 3 و 4 و 5، بۆیە 5 ڕیز دەبێت."], ["for j in range(1, 6):", "لووپی ناوەوە: هەر ستوونێک. بۆ هەر ڕیز، <code>j</code> دەبێتە 1 تا 5."], ["print(i * j, end=\"\\t\")", "<code>i * j</code> چاپ دەکات. <code>end=\"\\t\"</code> واتە لە جیاتی چوونە هێڵی نوێ، Tab (بۆشاییەکی گەورە) دادەنێت، بۆیە ژمارەکان لە یەک هێڵدا دەمێننەوە. بۆ i = 2: 2 و 4 و 6 و 8 و 10."], ["print()", "هیچ نانووسێت و تەنها دەچێتە هێڵی نوێ. بە 4 بۆشایی لە ژێر لووپی دەرەوەیە (نەک ناوەوە)، بۆیە هەر ڕیزێک دوای تەواوبوونی j یەک جار."]], [["for i in range(1, 4):", "لووپی دەرەوە: <code>i</code> دەبێتە 1 و 2 و 3، بۆیە 3 خول دەبێت."], ["print(\"Outer:\", i)", "لە لووپی دەرەوەدایە، بۆیە بۆ هەر <code>i</code> یەک جار: <b>3 جار</b> (وەڵامی پرسیاری 1)."], ["for j in range(1, 3):", "لووپی ناوەوە: <code>j</code> دەبێتە 1 و 2 (3 نییە). بۆ هەر <code>i</code> دوو خول."], ["print(\"  Inner:\", j)", "دوو بۆشایی لەپێش <code>Inner:</code> دادەنێت. 3 * 2 = <b>6 جار</b> جێبەجێ دەبێت (وەڵامی پرسیاری 2)."]], [["n = 5", "گۆڕاوی <code>n</code> دروست دەکات لە جۆری int و بەهای 5ی دەداتێ."], ["while n > 0:", "مەرجی <code>n &gt; 0</code> دەپشکنێت. بۆ 5 و 4 و 3 و 2 و 1 True ــە. کاتێک n = 0 بێت، 0 &gt; 0 False ــە و لووپەکە دەوەستێت."], ["print(n)", "بەهای <code>n</code> چاپ دەکات: 5 و 4 و 3 و 2 و 1."], ["n = n - 1", "بەهای <code>n</code> یەک کەم دەکات: 5 دەبێتە 4، 4 دەبێتە 3 ... 1 دەبێتە 0."], ["print(\"Liftoff!\")", "ئەم هێڵە بێ بۆشاییە، واتە دوای لووپەکەیە. یەک جار دەنووسێت <code>Liftoff!</code>."]], [["rows = int(input(\"Enter number of rows: \"))", "<code>input()</code> ژمارەکە وەک نووسراو (str) وەردەگرێت و <code>int()</code> دەیکات بە int. لێرە 4 دەنووسرێت، بۆیە <code>rows = 4</code>."], ["for i in range(1, rows + 1):", "<code>range(1, rows + 1)</code> واتە <code>range(1, 5)</code>: i دەبێتە 1 و 2 و 3 و 4. <code>+ 1</code> دەنووسرێت چونکە stop خۆی نایگاتێ."], ["for j in range(1, i + 1):", "ژمارەی ئەستێرەکانی ئەم ڕیزە دیاری دەکات. بۆ i = 3: <code>range(1, 4)</code> واتە j = 1 و 2 و 3، سێ ئەستێرە."], ["print(\"*\", end=\"\")", "ئەستێرەیەک چاپ دەکات بەبێ چوونە هێڵی نوێ (<code>end=\"\"</code> واتە هیچ دانانێت)."], ["print()", "ڕیزەکە تەواو دەکات و دەچێتە هێڵی نوێ. ئەم هێڵە بۆ لووپی دەرەوەیە، بۆیە هەر ڕیزێک یەک جار."]], [["n = int(input(\"Enter a positive integer n: \"))", "ژمارەکە وەردەگرێت و دەیکات بە int. لێرە 5 دەنووسرێت، بۆیە <code>n = 5</code>."], ["total = 0", "گۆڕاوی <code>total</code> دروست دەکات (int) بە 0، بۆ کۆکردنەوەی ژمارەکان."], ["for i in range(1, n + 1):", "<code>range(1, 6)</code> ژمارەکانی 1 و 2 و 3 و 4 و 5 دروست دەکات. <code>n + 1</code> بەکاردێت چونکە stop خۆی نایگاتێ، بۆیە 5 دەگاتە ناو."], ["total = total + i", "<code>i</code> دەخاتە سەر <code>total</code>: 0 + 1 = 1، 1 + 2 = 3، 3 + 3 = 6، 6 + 4 = 10، 10 + 5 = 15."], ["print(\"Sum:\", total)", "لە دەرەوەی لووپەکەیە و یەک جار دەنووسێت <code>Sum: 15</code>."]], [["n = int(input(\"Enter a non-negative integer n: \"))", "ژمارەکە وەردەگرێت و دەیکات بە int. لێرە 5 دەنووسرێت، بۆیە <code>n = 5</code>."], ["factorial = 1", "گۆڕاوی <code>factorial</code> دروست دەکات (int) بە 1 نەک 0، چونکە لە لێکدان 0 هەموو شتێک دەکاتە 0. ئەگەر n = 0 بێت، <code>range(1, 1)</code> هیچ ژمارەیەکی نییە، لووپەکە ناگەڕێتەوە و ئەمە هەر 1 دەمێنێتەوە، کە وەڵامی ڕاستی 0! ــە."], ["for i in range(1, n + 1):", "<code>range(1, 6)</code> ژمارەکانی 1 و 2 و 3 و 4 و 5 دروست دەکات. پێنج خول."], ["factorial = factorial * i", "بەهای کۆن لە <code>i</code> دەدات: 1 * 1 = 1، 1 * 2 = 2، 2 * 3 = 6، 6 * 4 = 24، 24 * 5 = 120."], ["print(\"Factorial:\", factorial)", "لە دەرەوەی لووپەکەیە و یەک جار دەنووسێت <code>Factorial: 120</code>."]], [["rows = int(input(\"Enter number of rows: \"))", "ژمارەکە وەردەگرێت و دەیکات بە int. لێرە 4 دەنووسرێت، بۆیە <code>rows = 4</code>."], ["for i in range(rows, 0, -1):", "<code>range(4, 0, -1)</code>: لە 4 دەست پێدەکات و هەر جارێک 1 کەم دەکات: 4 و 3 و 2 و 1. 0 نایگاتێ. بۆیە ڕیزی یەکەم زۆرترین ئەستێرەی هەیە."], ["for j in range(1, i + 1):", "ژمارەی ئەستێرەی ئەم ڕیزە. بۆ i = 4: j = 1 تا 4 (چوار ئەستێرە). بۆ i = 1: j تەنها 1 (یەک ئەستێرە)."], ["print(\"*\", end=\"\")", "ئەستێرەیەک چاپ دەکات بەبێ چوونە هێڵی نوێ."], ["print()", "ڕیزەکە تەواو دەکات و دەچێتە هێڵی نوێ."]]], "EXSUM": ["لیستی <code>[1, 2, 3]</code> سێ توخمی هەیە، بۆیە بلۆکەکە سێ جار دەگەڕێتەوە. خولی یەکەم: <code>i</code> دەبێتە 1 و <code>print(i)</code> دەنووسێت 1. خولی دووەم: <code>i</code> دەبێتە 2 و دەنووسێت 2. خولی سێیەم: <code>i</code> دەبێتە 3 و دەنووسێت 3. توخمی دیکە نەماوە، بۆیە لووپەکە تەواو دەبێت و دەرەنجام 1 و 2 و 3ـە لە سێ هێڵدا.", "<code>range(4)</code> ژمارەکانی 0 و 1 و 2 و 3 دروست دەکات (دەست پێدەکات لە 0 و دەوەستێت پێش 4). خولی یەکەم: <code>i = 0</code> و <code>print(i)</code> دەنووسێت 0. خولی دووەم: <code>i = 1</code> و دەنووسێت 1. خولی سێیەم: <code>i = 2</code> و دەنووسێت 2. خولی چوارەم: <code>i = 3</code> و دەنووسێت 3. لە کۆتاییدا چوار هێڵ دەنووسرێت: 0 و 1 و 2 و 3.", "<code>range(2, 6)</code> چوار ژمارە دروست دەکات: 2 و 3 و 4 و 5. خولی یەکەم: <code>i = 2</code> و دەنووسرێت 2. خولی دووەم: <code>i = 3</code> و دەنووسرێت 3. خولی سێیەم: <code>i = 4</code const FORMSPREE_URL='https://formspree.io/f/xyekorok';
function fbVisitorCode(){
 try{
  let c=localStorage.getItem('fbVisitorCode');
  if(!c){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';c='';for(let i=0;i<4;i++)c+=ch[Math.floor(Math.random()*ch.length)];localStorage.setItem('fbVisitorCode',c);}

 }catch(e){return '----';}
}
function fbShowMsg(ok,text){const m=document.getElementById('fbMsg');m.className='fb-msg '+(ok?'ok':'err');m.textContent=text;}
async function fbSubmit(subject,body){const btn=document.getElementById('fbSendBtn');btn.disabled=true;btn.textContent='⏳ دەنێردرێت...';
 const code=fbVisitorCode();
 try{
  const res=await fetch(FORMSPREE_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({subject:subject,message:body,visitor_code:code})});
  if(res.ok){fbShowMsg(true,'✅ نامەکەت بە سەرکەوتوویی نێردرا، سوپاس! (کۆدی تۆ: '+code+')');document.getElementById('fbText').value='';}
  else{fbShowMsg(false,'❌ نەتوانرا نامەکە بنێردرێت. تکایە دووبارە هەوڵ بدەرەوە.');}
 }catch(e){fbShowMsg(false,'❌ کێشەیەک لە پەیوەندیدا ڕوویدا. ئینتەرنێتەکەت بپشکنە و دووبارە هەوڵ بدەرەوە.');}
 btn.disabled=false;btn.textContent='📤 ناردنی نامە';}

}

function post(subject,message){return fetch(FORM_URL,{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:JSON.stringify({subject:subject,message:message,visitor_code:visitorCode()})});}
function holdEnd(){if(holdTimeout){clearTimeout(holdTimeout);holdTimeout=null;}if(holdInterval){clearInterval(holdInterval);holdInterval=null;}const b=$("lockReqBtn");if(b){b.classList.remove("holding");b.style.setProperty("--hold-pct","0%");}}
function closeMenu(){const d=$("drawer"),b=$("drawerBg");if(d)d.classList.remove("open");if(b)b.classList.remove("open");}
function forceLock(msg){
  closeMenu();
  if(unsub){unsub();unsub=null;}
  if(expTimer){clearInterval(expTimer);expTimer=null;}
  lsRemove(["siteAccessCode","siteAccessName","siteAccessExpires"]);
  document.body.classList.add("locked");
  $("lockOverlay").classList.remove("hide");
  $("lockMsg").textContent=msg||"";
  $("lockInput").value="";
  const n=$("lockNameInput");if(n&&!n.hasAttribute("readonly"))n.value="";
}
function clearRequest(){
  lsRemove(["siteReqName","siteReqNameEncoded","siteReqContact"]);
  holdEnd();
  const a=$("lockReqName");if(a){a.removeAttribute("readonly");a.value="";}
  const c=$("lockReqContact");if(c)c.value="";
  const n=$("lockNameInput");if(n){n.removeAttribute("readonly");n.value="";}
}
function forceLockAndClear(msg){forceLock(msg);clearRequest();}
function watchExpiry(ms){
  if(expTimer){clearInterval(expTimer);expTimer=null;}
  if(ms)expTimer=setInterval(()=>{if(Date.now()>=ms)forceLock("❌ کۆدەکە بەسەرچوو، داوای کۆدێکی نوێ بکە");},1000);
}
function watchCode(code,expMs){
  if(!db)return;
  if(unsub)unsub();
  watchExpiry(expMs);
  unsub=db.collection("accessCodes").doc(code).onSnapshot(snap=>{
    if(!snap.exists){forceLockAndClear("❌ مۆڵەتی چوونەژوورەوەت لابرا");return;}
    const d=snap.data(),e=d.expiresAt?d.expiresAt.toMillis():null;
    if(e&&e<Date.now())forceLock("❌ کۆدەکە بەسەرچوو، داوای کۆدێکی نوێ بکە");else watchExpiry(e);
  },()=>{});
}
async function notifyLogin(name,code){try{await post("✅ چوونەژوورەوەی سەرکەوتوو",'بەکارهێنەر "'+name+'" سەرکەووتوبوو لە چوونە ژوورەوە.\nکۆد بەکارهاتوو: '+code);}catch(e){}}
async function checkLock(){
  const nameEl=$("lockNameInput"),codeEl=$("lockInput"),btn=$("lockBtn"),msg=$("lockMsg");
  const code=codeEl.value.trim().toUpperCase(),typed=nameEl.value;
  if(!typed.trim()){msg.textContent="❌ تکایە ناوت بنووسە";nameEl.classList.add("err");setTimeout(()=>nameEl.classList.remove("err"),350);showAlert("تکایە ناوت بنووسە");return;}
  if(!code){codeEl.focus();return;}
  btn.disabled=true;const old=btn.textContent;btn.textContent="⏳ پشکنین...";msg.textContent="";
  let realName=typed;
  if(nameEl.hasAttribute("readonly")){try{const r=localStorage.getItem("siteReqNameEncoded");if(r)realName=r;}catch(e){}}
  try{
    if(!db)throw new Error("no-db");
    const snap=await db.collection("accessCodes").doc(code).get();
    const data=snap.exists?snap.data():null;
    const expMs=data&&data.expiresAt?data.expiresAt.toMillis():null;
    const expired=!!(expMs&&expMs<Date.now());
    if(data&&!expired&&norm(realName)===norm(data.name||"")){
      const shown=decodeName(typed);
      try{localStorage.setItem("siteAccessCode",code);localStorage.setItem("siteAccessName",shown);localStorage.setItem("siteAccessExpires",expMs||"");}catch(e){}
      $("lockOverlay").classList.add("hide");document.body.classList.remove("locked");
      msg.textContent="";codeEl.classList.remove("err");nameEl.classList.remove("err");
      showAlert("بەکارهێنەر "+shown+" سەرکەوتوو بوو لە چوونەژوورەوە","✅ سەرکەوتوو");
      notifyLogin(shown,code);
      try{watchCode(code,expMs);}catch(e){}
    }else{
      const why=data?(expired?"کۆدەکە بەسەرچوو":"ناوەکە لەگەڵ کۆدەکە ناگونجێت"):"کۆدەکە هەڵەیە، تکایە دووبارە هەوڵ بدەرەوە";
      msg.textContent="❌ "+why;codeEl.classList.add("err");nameEl.classList.add("err");codeEl.value="";codeEl.focus();
      setTimeout(()=>{codeEl.classList.remove("err");nameEl.classList.remove("err");},350);
      showAlert(why);
    }
  }catch(e){
    const m="نەتوانرا پەیوەندی بە سێرڤەرەوە بکرێت، ئینتەرنێتەکەت بپشکنە";
    msg.textContent="❌ "+m;showAlert(m);
  }
  btn.disabled=false;btn.textContent=old;
}
function toggleReq(){$("lockReq").classList.toggle("open");$("lockReqName").focus();}
async function sendReq(){
  const nameEl=$("lockReqName"),contactEl=$("lockReqContact"),msg=$("lockReqMsg"),btn=$("lockReqBtn");
  if(nameEl.hasAttribute("readonly"))return;
  const name=nameEl.value.trim(),contact=contactEl.value.trim();
  if(!name){nameEl.focus();nameEl.classList.add("err");setTimeout(()=>nameEl.classList.remove("err"),350);return;}
  if(!EN_NAME_RE.test(name)||name.length<6||!/[0-9]/.test(name)){
    nameEl.classList.add("err");setTimeout(()=>nameEl.classList.remove("err"),350);
    msg.style.color="#991b1b";msg.textContent="❌ بە ئینگلیزی بنووسە، نموونە: alifazll56";
    nameEl.value="";contactEl.value="";
    showAlert("❌ بە ئینگلیزی بنووسە، نموونە: alifazll56\nناوی خۆت+ناوی باوکت+ژمارە\nلایەنی کەم پێویستە ناوەکە لە شەش پیت کەمتر نەبێت");
    return;
  }
  if(!contact){contactEl.focus();contactEl.classList.add("err");setTimeout(()=>contactEl.classList.remove("err"),350);return;}
  btn.disabled=true;btn.textContent="⏳ دەنێردرێت...";
  const enc=encodeName(name);
  try{
    const r=await post("داواکاری مۆڵەتی چوونەژوورەوە","کەسێک داوای مۆڵەتی چوونەژوورەوەی ماڵپەڕەکەی دەکات.\nناوی پیشاندان: "+name+"\nنرخی ڕاستەقینە (ئەمە بنووسە لە Firestore بۆ خانەی name): "+enc+"\nپەیوەندی: "+contact);
    if(r.ok){
      msg.style.color="#166534";msg.textContent="✅ داواکارییەکەت نێردرا بۆ دروستکەری ماڵپەڕ. چاوەڕێی کۆدەکەت بە.";
      nameEl.setAttribute("readonly","readonly");
      try{localStorage.setItem("siteReqName",name);localStorage.setItem("siteReqNameEncoded",enc);localStorage.setItem("siteReqContact",contact);}catch(e){}
      const ln=$("lockNameInput");ln.value=name;ln.setAttribute("readonly","readonly");$("lockInput").focus();
    }else{msg.style.color="#991b1b";msg.textContent="❌ نەتوانرا بنێردرێت، دووبارە هەوڵ بدەرەوە.";}
  }catch(e){msg.style.color="#991b1b";msg.textContent="❌ کێشەی ئینتەرنێت ڕوویدا.";}
  btn.disabled=false;btn.textContent="📤 ناردنی داواکاری";
}
function holdStart(){
  const nameEl=$("lockReqName");
  if(!nameEl||!nameEl.hasAttribute("readonly")||holdTimeout)return;
  const btn=$("lockReqBtn");if(!btn)return;
  let t=0;btn.classList.add("holding");btn.style.setProperty("--hold-pct","0%");
  holdInterval=setInterval(()=>{t+=100;btn.style.setProperty("--hold-pct",Math.min(100,t/5000*100)+"%");},100);
  holdTimeout=setTimeout(()=>{holdEnd();sendReminder();},5000);
}
async function sendReminder(){
  const msg=$("lockReqMsg");let name=null,enc=null,contact=null;
  try{name=localStorage.getItem("siteReqName");enc=localStorage.getItem("siteReqNameEncoded");contact=localStorage.getItem("siteReqContact");}catch(e){}
  if(!name)return;
  if(msg){msg.style.color="#5b21b6";msg.textContent="⏳ بیرخستنەوە دەنێردرێت...";}
  try{
    const r=await post("🔔 بیرخستنەوە: داواکاری چاوەڕوانی مۆڵەتە","بیرخستنەوەیە: ئەم بەکارهێنەرە هێشتا چاوەڕێی کۆدی چوونەژوورەوەیە.\nناوی پیشاندان: "+name+"\nنرخی ڕاستەقینە (ئەمە بنووسە لە Firestore بۆ خانەی name): "+(enc||"")+"\nپەیوەندی: "+(contact||""));
    if(msg){if(r.ok){msg.style.color="#166534";msg.textContent="🔔 بیرخستنەوەکە نێردرا بۆ خاوەن ماڵپەڕ";}else{msg.style.color="#991b1b";msg.textContent="❌ نەتوانرا بیرخستنەوەکە بنێردرێت";}}
  }catch(e){if(msg){msg.style.color="#991b1b";msg.textContent="❌ کێشەی ئینتەرنێت ڕوویدا.";}}
}
window.checkLock=checkLock;
window.lockToggleReq=toggleReq;
window.lockSendReq=sendReq;
window.lockHoldStart=holdStart;
window.lockHoldEnd=holdEnd;
window.lockCloseAlert=function(){$("lockAlertOverlay").classList.remove("open");};
window.siteMenu=function(open){
  if(!open){closeMenu();return;}
  let nm="";try{nm=localStorage.getItem("siteAccessName")||"";}catch(e){}
  $("drawerUser").textContent=nm?"👤 "+nm:"";
  $("drawer").classList.add("open");$("drawerBg").classList.add("open");
};
window.siteLogout=function(){forceLock("");};
window.siteAssignments=function(){
  closeMenu();
  $("asgList").innerHTML=ASSIGNMENTS.length?ASSIGNMENTS.map(a=>'<div class="asg-item"><b>'+escH(a.t||"")+'</b>'+(a.d?'<span class="asg-due">'+escH(a.d)+'</span>':'')+(a.n?'<p>'+escH(a.n)+'</p>':'')+(a.u&&/^https?:\/\//.test(a.u)?'<a href="'+escH(a.u)+'" target="_blank" rel="noopener">بکەرەوە ↗</a>':'')+'</div>').join(""):'<div class="asg-empty">هێشتا هیچ ئەسایمێنتێک زیاد نەکراوە.</div>';
  $("asgOverlay").classList.add("open");
};
window.asgClose=function(){$("asgOverlay").classList.remove("open");};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu();});
// restore a pending request (name stays locked, grey, even after refresh)
try{const rn=localStorage.getItem("siteReqName");if(rn){const a=$("lockReqName");a.value=rn;a.setAttribute("readonly","readonly");const b=$("lockNameInput");b.value=rn;b.setAttribute("readonly","readonly");}}catch(e){}
// restore an existing session
(async function(){
  let code=null;try{code=localStorage.getItem("siteAccessCode");}catch(e){}
  if(code){
    try{
      if(!db)throw new Error("no-db");
      const snap=await db.collection("accessCodes").doc(code).get();
      if(snap.exists){
        const d=snap.data(),e=d.expiresAt?d.expiresAt.toMillis():null;
        if(!(e&&e<Date.now())){$("lockOverlay").classList.add("hide");document.body.classList.remove("locked");watchCode(code,e);return;}
        forceLock("❌ کۆدەکە بەسەرچوو، داوای کۆدێکی نوێ بکە");
        ($("lockNameInput").hasAttribute("readonly")?$("lockInput"):$("lockNameInput")).focus();
        return;
      }
    }catch(e){
      // no connection: keep the earlier login so the site stays usable
      $("lockOverlay").classList.add("hide");document.body.classList.remove("locked");return;
    }
    lsRemove(["siteAccessCode","siteAccessName","siteAccessExpires"]);
    clearRequest();
  }
  ($("lockNameInput").hasAttribute("readonly")?$("lockInput"):$("lockNameInput")).focus();
})();
})();
</script>
